<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Coach — Tolulope Adebisi | GE Healthcare</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0e0e12;--ink2:#3a3a44;--ink3:#7a7a88;
  --cream:#f8f6f1;--paper:#fffffe;
  --ge-navy:#003087;--ge-teal:#00858a;--ge-gold:#c8a951;
  --success:#1a7a4a;--warn:#b85c00;--danger:#8b2020;
  --border:#e4e0d8;--border2:#d0ccc2;
  --highlight:#fff8d0;--highlight-b:#e6d800;
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;font-size:14px}

/* Header */
.app-header{background:var(--ge-navy);color:#fff;padding:1rem 1.75rem;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--ge-teal)}
.header-left h1{font-family:'DM Serif Display',serif;font-size:18px;font-weight:400;letter-spacing:-0.01em;color:#fff}
.header-left p{font-size:11px;opacity:0.65;margin-top:3px;letter-spacing:0.03em;text-transform:uppercase}
.header-badge{background:var(--ge-teal);color:#fff;font-size:10px;font-weight:600;padding:4px 12px;border-radius:2px;letter-spacing:0.08em;text-transform:uppercase}

/* API Bar */
.api-bar{background:#fff;border-bottom:1px solid var(--border);padding:0.6rem 1.75rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.api-bar label{font-size:11px;font-weight:600;color:var(--ink2);white-space:nowrap;text-transform:uppercase;letter-spacing:0.05em}
.key-wrap{position:relative;flex:1;min-width:200px;max-width:340px}
.key-input{width:100%;padding:0.4rem 2.25rem 0.4rem 0.75rem;font-size:12px;border:1px solid var(--border2);border-radius:4px;color:var(--ink);background:var(--cream);font-family:monospace;outline:none;transition:border 0.15s}
.key-input:focus{border-color:var(--ge-navy)}
.key-toggle{position:absolute;right:0.6rem;top:50%;transform:translateY(-50%);background:none;border:none;font-size:12px;cursor:pointer;color:var(--ink3)}
.key-save{padding:0.4rem 0.9rem;font-size:11px;font-weight:600;border:1px solid var(--ge-navy);background:var(--ge-navy);color:#fff;border-radius:4px;cursor:pointer;text-transform:uppercase;letter-spacing:0.05em}
.key-save:hover{background:#00225c}
.key-status{font-size:11px;font-weight:500;padding:3px 9px;border-radius:10px}
.key-status.set{background:#d4f0e4;color:#1a7a4a}
.key-status.unset{background:#fce8e8;color:#8b2020}
.api-note{font-size:10px;color:var(--ink3);flex-basis:100%;margin-top:1px}

/* Nav */
.nav{display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;padding:0 1.75rem}
.nav-btn{padding:0.75rem 1rem;font-size:12px;font-weight:500;color:var(--ink3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.15s;letter-spacing:0.02em}
.nav-btn:hover{color:var(--ink)}
.nav-btn.active{color:var(--ge-navy);border-bottom-color:var(--ge-navy);font-weight:600}
.nav-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px;margin-left:5px;vertical-align:middle;letter-spacing:0.03em}
.b-hr{background:#d4f0e4;color:#1a7a4a}.b-hm{background:#ddeefa;color:#185fa5}
.b-tp{background:#fce8d0;color:#b85c00}.b-vp{background:#eedff8;color:#6636a8}
.b-tip{background:#e6f9f0;color:#0f6e56}.b-ai{background:#fff0cc;color:#8a5a00}
.b-gaps{background:#fce8e8;color:#8b2020}
.b-grader{background:#f0eaff;color:#5a2ca0}.b-gameday{background:#fff3cc;color:#7a4e00}

/* Layout */
.layout{display:flex;min-height:calc(100vh - 148px)}
.side-resume{width:300px;min-width:160px;background:#fff;border-right:1px solid var(--border);overflow-y:auto;padding:1rem 1.25rem;flex-shrink:0;font-size:12px}
.side-resume-header{font-size:10px;font-weight:700;color:var(--ge-teal);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.75rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.res-sec{border-radius:6px;padding:0.65rem 0.8rem;margin-bottom:6px;border:1px solid var(--border);background:var(--cream);transition:all 0.25s}
.res-sec.lit{background:var(--highlight);border-color:var(--highlight-b);animation:flash 0.4s ease-out}
@keyframes flash{0%{background:#fffaaa}100%{background:var(--highlight)}}
.res-sec-title{font-size:12px;font-weight:600;color:var(--ge-navy);margin-bottom:2px}
.res-sec.lit .res-sec-title{color:#4a3800}
.res-sec-sub{font-size:10.5px;color:var(--ink3);margin-bottom:4px}
.res-sec-body{font-size:11.5px;color:var(--ink2);line-height:1.55}
.res-sec.lit .res-sec-body{color:#3a3000}
.ref-tag{font-size:9.5px;font-weight:700;color:#5a4200;background:#f5dd60;padding:1px 7px;border-radius:4px;display:inline-block;margin-bottom:4px}
.res-hint{background:#edf5ff;border:1px solid #b5d4f4;border-radius:6px;padding:0.5rem 0.7rem;margin-bottom:8px;font-size:11px;color:#185fa5;line-height:1.5}

.resize-h{width:5px;min-width:5px;background:var(--border);cursor:col-resize;flex-shrink:0;transition:background 0.15s;display:flex;align-items:center;justify-content:center}
.resize-h:hover,.resize-h.drag{background:var(--ge-navy)}
.resize-h::after{content:'';display:block;width:2px;height:28px;background:rgba(255,255,255,0.6);border-radius:2px}

.main-col{flex:1;min-width:0;overflow-y:auto}
.main-inner{max-width:800px;margin:0 auto;padding:1.75rem 1.5rem}

.jd-resize{width:5px;min-width:5px;background:var(--border);cursor:col-resize;flex-shrink:0;transition:background 0.15s;display:flex;align-items:center;justify-content:center}
.jd-resize:hover,.jd-resize.drag{background:var(--ge-teal)}
.jd-resize::after{content:'';display:block;width:2px;height:28px;background:rgba(255,255,255,0.6);border-radius:2px}

.side-jd{width:300px;min-width:160px;background:#fff;border-left:1px solid var(--border);overflow-y:auto;padding:1rem 1.25rem;flex-shrink:0;font-size:12px}
.side-jd.collapsed{width:40px!important;min-width:40px;overflow:hidden;padding:0}
.jd-header{font-size:10px;font-weight:700;color:var(--ge-teal);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.75rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;white-space:nowrap}
.jd-tab{display:none;writing-mode:vertical-rl;font-size:10px;font-weight:700;color:var(--ge-teal);letter-spacing:0.1em;text-transform:uppercase;padding:1rem 0.6rem;cursor:pointer;white-space:nowrap;height:100%;align-items:center;justify-content:center}
.side-jd.collapsed .jd-tab{display:flex}
.side-jd.collapsed .jd-inner{display:none}
.jd-sec{border-radius:6px;padding:0.65rem 0.8rem;margin-bottom:6px;border:1px solid var(--border);background:var(--cream);transition:all 0.25s}
.jd-sec.lit{background:var(--highlight);border-color:var(--highlight-b);animation:flash 0.4s ease-out}
.jd-sec-title{font-size:11.5px;font-weight:600;color:#085041;margin-bottom:3px}
.jd-sec.lit .jd-sec-title{color:#4a5200}
.jd-sec-body{font-size:11px;color:var(--ink2);line-height:1.55}
.jd-sec.lit .jd-sec-body{color:#3a3000}
.jd-ref{font-size:9.5px;font-weight:700;color:#5a4200;background:#f5dd60;padding:1px 7px;border-radius:4px;display:inline-block;margin-bottom:4px}

/* Stage intro */
.stage-intro{background:#fff;border:1px solid var(--border);border-radius:10px;padding:1.1rem 1.25rem;margin-bottom:1.25rem;border-left:4px solid var(--ge-navy)}
.stage-intro h2{font-family:'DM Serif Display',serif;font-size:17px;font-weight:400;color:var(--ge-navy);margin-bottom:0.35rem}
.stage-intro p{font-size:13px;color:var(--ink2);line-height:1.65}
.stage-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:0.65rem}
.chip{font-size:11px;background:var(--cream);color:var(--ink2);padding:3px 10px;border-radius:12px;border:1px solid var(--border2)}

/* Mode toggle */
.mode-row{display:flex;gap:8px;align-items:center;background:var(--cream);border-radius:6px;padding:3px;margin-bottom:1rem;border:1px solid var(--border)}
.mode-opt{padding:0.4rem 0.9rem;font-size:12px;font-weight:500;border:none;background:none;border-radius:4px;cursor:pointer;color:var(--ink3);transition:all 0.15s}
.mode-opt.active{background:#fff;color:var(--ge-navy);box-shadow:0 1px 4px rgba(0,0,0,0.07);font-weight:600}

/* Progress */
.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
.prog-bar{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--ge-teal);border-radius:2px;transition:width 0.3s}
.prog-label{font-size:11px;color:var(--ink3);white-space:nowrap}

/* Card */
.q-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:1.5rem;min-height:300px;display:flex;flex-direction:column}
.q-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:0.85rem;gap:10px}
.q-num{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:0.07em}
.q-cat{font-size:11px;color:var(--ink3);background:var(--cream);padding:3px 9px;border-radius:8px;border:1px solid var(--border);white-space:nowrap}
.q-text{font-family:'DM Serif Display',serif;font-size:20px;font-weight:400;line-height:1.5;color:var(--ink);flex:1;font-style:italic}

.reveal-btn{margin-top:1.25rem;padding:0.65rem 1.4rem;background:var(--ge-navy);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;transition:background 0.15s;align-self:flex-start}
.reveal-btn:hover{background:#00225c}

.answer-block{margin-top:1.1rem;border-top:1px solid var(--border);padding-top:1.1rem;display:none}
.answer-block.show{display:block}
.answer-label{font-size:9.5px;font-weight:700;letter-spacing:0.1em;color:var(--success);text-transform:uppercase;margin-bottom:0.5rem}

/* Story answer styles */
.answer-text p{font-size:14.5px;line-height:1.8;color:#1a1a22;margin-bottom:0.85rem}
.answer-text p:last-child{margin-bottom:0}
.answer-text .story-hook{font-size:15.5px;font-style:italic;color:var(--ge-navy);border-left:3px solid var(--ge-teal);padding-left:0.85rem;margin-bottom:0.85rem}
.answer-text .story-data{background:#f0f8ff;border-radius:6px;padding:0.65rem 0.85rem;font-size:13.5px;color:#185fa5;margin:0.65rem 0;border-left:3px solid #185fa5;line-height:1.7}
.answer-text .story-lesson{font-size:13px;color:var(--ink3);font-style:italic;margin-top:0.5rem}

.coach-note{margin-top:0.85rem;background:#f5f0ff;border:1px solid #d8cefc;border-radius:6px;padding:0.75rem 0.9rem;font-size:12.5px;color:#5a3faa;line-height:1.6}
.coach-note strong{font-weight:600}

.score-row{display:flex;gap:8px;margin-top:0.9rem;flex-wrap:wrap;align-items:center}
.score-label{font-size:11.5px;color:var(--ink3)}
.score-btn{padding:0.4rem 0.9rem;font-size:12px;border-radius:14px;border:1px solid;cursor:pointer;font-weight:500;transition:all 0.12s}
.score-btn.easy{border-color:var(--success);color:var(--success);background:#f0fbf5}
.score-btn.easy:hover,.score-btn.easy.picked{background:var(--success);color:#fff}
.score-btn.med{border-color:var(--warn);color:var(--warn);background:#fff5ec}
.score-btn.med:hover,.score-btn.med.picked{background:var(--warn);color:#fff}
.score-btn.hard{border-color:var(--danger);color:var(--danger);background:#fdf0f0}
.score-btn.hard:hover,.score-btn.hard.picked{background:var(--danger);color:#fff}

/* Nav controls */
.nav-controls{display:flex;align-items:center;justify-content:space-between;margin-top:1.25rem}
.ctrl-btn{padding:0.6rem 1.1rem;border:1px solid var(--border2);background:#fff;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink2);cursor:pointer;transition:all 0.15s}
.ctrl-btn:hover:not(:disabled){background:var(--cream);border-color:var(--ink3)}
.ctrl-btn:disabled{opacity:0.25;cursor:not-allowed}
.ctrl-btn.primary{background:var(--ge-navy);color:#fff;border-color:var(--ge-navy)}
.ctrl-btn.primary:hover:not(:disabled){background:#00225c}

/* Overview */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:1.25rem}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:0.9rem 1rem}
.stat-l{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink3);margin-bottom:4px}
.stat-n{font-size:24px;font-weight:600;color:var(--ge-navy)}
.stat-s{font-size:11.5px;color:var(--ink3);margin-top:2px}
.stage-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:1.25rem}
.stage-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:0.9rem 1rem;cursor:pointer;transition:all 0.15s}
.stage-card:hover{border-color:var(--ge-navy);box-shadow:0 2px 8px rgba(0,48,135,0.08)}
.stage-prog{margin-top:8px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.stage-prog-fill{height:100%;background:var(--ge-teal);border-radius:2px}

/* Tips */
.tip-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:1.1rem 1.25rem;margin-bottom:10px;display:flex;gap:12px}
.tip-num{min-width:26px;height:26px;border-radius:50%;background:var(--ge-navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:2px;flex-shrink:0}
.tip-title{font-weight:600;font-size:14px;color:var(--ge-navy);margin-bottom:5px}
.tip-body{font-size:13px;line-height:1.7;color:var(--ink2)}

/* Done screen */
.done-screen{text-align:center;padding:3rem 2rem}
.done-screen h3{font-family:'DM Serif Display',serif;font-size:24px;font-weight:400;color:var(--ge-navy);margin-bottom:0.6rem}
.done-stats{display:flex;gap:20px;justify-content:center;margin:1.5rem 0;flex-wrap:wrap}
.done-stat .n{font-size:32px;font-weight:600}
.done-stat .l{font-size:12px;color:var(--ink3)}

/* Search */
.search-wrap{position:relative;margin-bottom:1rem}
.search-input{width:100%;padding:0.8rem 1rem 0.8rem 2.5rem;font-size:14px;border:1px solid var(--border2);border-radius:8px;background:#fff;color:var(--ink);outline:none;transition:border 0.15s}
.search-input:focus{border-color:var(--ge-navy)}
.search-icon{position:absolute;left:0.85rem;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:15px;pointer-events:none}
.search-clear{position:absolute;right:0.85rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--ink3);font-size:17px;cursor:pointer;line-height:1;padding:0}
.sr-label{font-size:11px;color:var(--ink3);margin-bottom:0.65rem;font-weight:500}
.sr-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:0.9rem 1.1rem;margin-bottom:8px;cursor:pointer;transition:all 0.15s}
.sr-card:hover{border-color:var(--ge-navy);box-shadow:0 0 0 2px rgba(0,48,135,0.06)}
.sr-stage{font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.sr-q{font-size:14px;font-weight:500;color:var(--ink);line-height:1.45;margin-bottom:5px}
.sr-preview{font-size:12.5px;color:var(--ink2);line-height:1.5}
.sr-expanded{background:#fff;border:1.5px solid var(--ge-navy);border-radius:12px;padding:1.25rem;margin-bottom:8px}
.sr-exp-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;gap:10px}
.sr-exp-close{background:none;border:none;font-size:20px;color:var(--ink3);cursor:pointer;line-height:1;padding:0;flex-shrink:0}

/* AI Box */
.ai-box{background:#fff;border:1px dashed #b5d4f4;border-radius:10px;padding:1.25rem}
.ai-box h4{font-family:'DM Serif Display',serif;font-size:15px;font-weight:400;color:var(--ge-navy);margin-bottom:0.35rem}
.ai-box p{font-size:13px;color:var(--ink2);margin-bottom:0.9rem;line-height:1.6}
.ai-q-area{min-height:80px;padding:0.65rem;font-size:13.5px;border:1px solid var(--border2);border-radius:6px;background:var(--cream);color:var(--ink);line-height:1.65;cursor:text;white-space:pre-wrap;outline:none;margin-bottom:0.85rem}
.ai-q-area:focus{border-color:var(--ge-navy)}
.ai-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:0.85rem}
.ai-stage-sel{padding:0.45rem 0.8rem;border:1px solid var(--border2);border-radius:6px;font-size:12px;color:var(--ink);background:#fff;outline:none}
.ai-gen-btn{padding:0.6rem 1.25rem;background:var(--ge-navy);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;transition:background 0.15s}
.ai-gen-btn:hover:not(:disabled){background:#00225c}
.ai-gen-btn:disabled{opacity:0.45;cursor:not-allowed}
.ai-key-warn{background:#fff8e8;border:1px solid #f5d080;border-radius:6px;padding:0.6rem 0.9rem;font-size:12px;color:#7a4a00;margin-bottom:0.85rem;line-height:1.5}
.ai-result{background:#f5fbff;border:1px solid #b5d4f4;border-radius:10px;padding:1.25rem;margin-top:0.9rem}
.ai-qlabel{font-size:9.5px;font-weight:700;color:#185fa5;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px}
.ai-qtext{font-family:'DM Serif Display',serif;font-size:16px;font-weight:400;color:var(--ink);margin-bottom:0.9rem;line-height:1.5;font-style:italic}
.ai-alabel{font-size:9.5px;font-weight:700;color:var(--success);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px;margin-top:1rem;padding-top:1rem;border-top:1px solid #d0e8f5}
.ai-save-row{display:flex;gap:8px;margin-top:1rem;flex-wrap:wrap}
.ai-save{padding:0.55rem 1.1rem;font-size:12.5px;font-weight:500;border-radius:6px;cursor:pointer;background:var(--ge-navy);color:#fff;border:1px solid var(--ge-navy)}
.ai-save:hover{background:#00225c}
.ai-discard{padding:0.55rem 1.1rem;font-size:12.5px;font-weight:500;border-radius:6px;cursor:pointer;background:#fff;color:var(--ink2);border:1px solid var(--border2)}
.ai-discard:hover{background:var(--cream)}
.gen-loading{display:flex;align-items:center;gap:10px;padding:1rem;font-size:13px;color:#185fa5}
.dots{display:flex;gap:4px}
.dots span{width:5px;height:5px;border-radius:50%;background:#185fa5;animation:dot 1.2s infinite}
.dots span:nth-child(2){animation-delay:0.2s}
.dots span:nth-child(3){animation-delay:0.4s}
@keyframes dot{0%,80%,100%{opacity:0.15}40%{opacity:1}}

/* Weakness section */
.gap-box{background:#fff8f8;border:1px solid #f5c0c0;border-left:4px solid var(--danger);border-radius:8px;padding:1rem 1.1rem;margin-bottom:10px}
.gap-box h3{font-size:13.5px;font-weight:600;color:var(--danger);margin-bottom:5px}
.gap-box p{font-size:13px;color:var(--ink2);line-height:1.65}
.gap-bridge{background:#edf8f0;border:1px solid #9ad4b3;border-left:4px solid var(--success);border-radius:8px;padding:0.9rem 1.1rem;margin-top:8px}
.gap-bridge .bridge-label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--success);margin-bottom:5px}
.gap-bridge p{font-size:13px;color:var(--ink2);line-height:1.65}

/* Answer Grader */
.grader-wrap{background:#fff;border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.25rem}
.grader-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink3);margin-bottom:6px}
.grader-textarea{width:100%;min-height:140px;padding:0.75rem;font-size:14px;font-family:'DM Sans',sans-serif;border:1px solid var(--border2);border-radius:8px;color:var(--ink);background:var(--cream);resize:vertical;outline:none;line-height:1.65;transition:border 0.15s}
.grader-textarea:focus{border-color:var(--ge-navy)}
.grader-q-sel{width:100%;padding:0.55rem 0.8rem;font-size:13px;border:1px solid var(--border2);border-radius:6px;color:var(--ink);background:#fff;outline:none;margin-bottom:0.85rem}

<script>

// Questions with story-first narrative answers
const QS={
hr:[
  {
    category:"Elevator Pitch",
    q:"Tell me about yourself and your sourcing background.",
    a:`<p class="story-hook">The honest version? I've built my entire career doing exactly what M&A integration requires — making order out of procurement chaos — I just never had the title for it until now.</p>

<p>I'm currently a Senior Procurement Manager at Maestrogrid in Toronto. I was brought in to build their enterprise category management framework from scratch — no playbook, no vendor governance, no clean data. What I inherited looked almost identical to what I imagine a Day 1 post-acquisition looks like: fragmented IT contracts, shadow purchasing across business units, no single source of truth. I built the framework, reduced time-to-award by 20%, and turned decentralized chaos into a governed operating model.</p>

<p>Before that, at Rhea Carrison, I managed multi-region vendor portfolios across IT, external labour, and professional services — delivering 12% cost savings while building vendor governance structures that reduced service disruptions by 30%. And before that, at Plural Health, I did IT procurement inside a highly regulated healthcare environment — which I know matters deeply at GE Healthcare, where software touches patient data and regulatory risk is real.</p>

<div class="story-data">What I find genuinely exciting about this integration role is that it takes everything I'm already doing and turns the stakes all the way up. You're not managing a procurement cycle — you're protecting business continuity while simultaneously capturing synergy savings across a newly combined supplier ecosystem. That's where I do my best work.</div>`,
    coaching:"Lead with the story, not your CV. The 'I've been doing M&A work without the title' framing is your most powerful bridge — own it confidently in the first 15 seconds.",
    resumeKeys:["maestrogrid","rhea","plural"],
    jdKeys:["integration_scope","disposition_strategy","project_mgmt"]
  },
  {
    category:"Motivations",
    q:"Why do you want this Sourcing Integration Lead role specifically?",
    a:`<p>Because integrations scare most procurement people — and I genuinely find them energising.</p>

<p>In a steady-state role, you're managing predictable cycles. But when two companies merge, you inherit somebody else's legacy contracts, their vendor relationships, their compliance gaps, their licensing landmines — and you have maybe 90 days before TSAs expire and the CFO starts asking why the synergy savings aren't showing up on the balance sheet. That's not a routine procurement problem. That's a project management, commercial strategy, and stakeholder alignment challenge all at once.</p>

<p>Every time I've walked into a fragmented environment — Maestrogrid, Rhea Carrison — I've found myself doing exactly this work: building the master supplier list nobody had, identifying the overlapping vendors nobody noticed, and sitting down with Legal, Finance and IT to decide what stays and what goes. The only difference here is that the environment is more explicit about what it is.</p>

<div class="story-data">GE Healthcare specifically is compelling to me because of the spin-off context. Your leadership team lived through the unwinding of TSAs from the original GE separation — which means you know better than almost anyone how catastrophically expensive it is to get integration wrong. I want to work somewhere that has that scar tissue and takes integration sourcing as seriously as this role suggests.</div>`,
    coaching:"Show that you've thought about GE Healthcare specifically. Referencing the 2023 spin-off and TSA experience tells them you've done your research and understand their unique context.",
    resumeKeys:["maestrogrid","rhea"],
    jdKeys:["integration_scope","project_mgmt"]
  },
  {
    category:"Experience Scope",
    q:"This role spans all supplier categories but IT and software represent a substantial share. Walk me through your software sourcing experience.",
    a:`<p>Software is where the money is — and where the most expensive mistakes happen during any transition.</p>

<p>At Maestrogrid, I architected the IT software category framework from the ground up. That meant not just running RFPs, but understanding the commercial mechanics underneath every contract: assignment clauses, enterprise versus entity-specific licensing definitions, true-up structures, and early termination penalties. When you're consolidating software after an acquisition, those aren't academic details — they're the landmines you have to find before the integration roadmap is written, not after.</p>

<p>At Rhea Carrison, I managed multi-region IT portfolios where we were essentially doing what integration does — consolidating vendors across different regional entities into a unified commercial structure. I learned firsthand that the biggest trap in software consolidation is assuming that because two offices use the same product, the licenses are compatible. Often they're not. Often one office has an enterprise agreement and the other has a named-user contract, and the vendor sees the merger as an opportunity to reset pricing entirely.</p>

<div class="story-data">Coming from Plural Health in a regulated healthcare environment adds another layer I know matters here: clinical software and anything touching patient data isn't just a commercial negotiation — it's a compliance audit before we can even discuss retaining the vendor. PIPEDA, HIPAA, SOC 2, Business Associate Agreements — these have to be assessed on Day 1, not in Month 3.</div>`,
    coaching:"Use specific contract mechanics language: assignment clauses, true-ups, BAAs. This proves you're not a generalist — you know the exact traps software integrations fall into.",
    resumeKeys:["maestrogrid","plural","skills"],
    jdKeys:["integration_scope","risk_mgmt","execution"]
  },
  {
    category:"Project Leadership",
    q:"This is an LPB role requiring strong project leadership without direct authority. How do you lead cross-functional teams?",
    a:`<p>The first thing I had to unlearn early in my career was that project leadership means managing tasks. It doesn't. It means managing the story people tell themselves about why they should cooperate.</p>

<p>At Rhea Carrison, I led a multi-region vendor governance overhaul. I needed HR, Finance, and regional IT leaders to change how they interacted with our suppliers — people who'd been doing things their way for years and saw no reason to change. If I'd shown up with a new policy document and told them to follow it, I would have created enemies. Instead, I built a dashboard that told the story in their language: here's what the old process is costing you specifically — your team's time, your budget, your disruption rate. Once the data became personal to their department, cooperation became self-interest.</p>

<div class="story-data">In integration work specifically, cross-functional leadership is almost entirely about timing and framing. IT doesn't care about cost synergies — they care about architecture alignment and not inheriting someone else's technical debt. Finance doesn't care about vendor relationships — they care about the savings number. Legal cares about liability. My job is to take the same sourcing decision and frame it differently for each audience, while keeping the project timeline moving forward regardless of which conversation I'm in.</div>`,
    coaching:"The phrase 'influence without authority' is the key LPB concept here. Show that you understand procurement's role as a facilitator, not a dictator — especially in matrixed enterprise environments.",
    resumeKeys:["rhea","krystal"],
    jdKeys:["project_mgmt","governance"]
  },
  {
    category:"Logistics",
    q:"What's your notice period, and are you comfortable managing multiple competing workstreams simultaneously?",
    a:`<p>Four weeks notice to ensure a clean handoff — I'd handle the transition the same way I'd manage a sourcing transition: thoroughly and with proper documentation.</p>

<p>On managing competing workstreams — yes, completely. At Maestrogrid right now I'm simultaneously running competitive RFPs, managing renewals, building category playbooks, and reporting to executive leadership. At Rhea Carrison, I was benchmarking rate cards, executing enterprise negotiations, and building governance frameworks concurrently across multiple regions. Competing priorities are just the environment, not the exception.</p>

<p>What helps me stay effective under that kind of load is being ruthlessly clear about sequencing. In an integration context specifically, I think of workstreams in terms of 'what breaks if this is late' — and that's what determines the execution order. A critical software renewal with an expiry date beats a medium-priority vendor consolidation that has timeline flexibility. I use that logic to triage constantly.</p>

<p>I'm fully authorized to work in Canada and ready to move forward whenever the timeline suits GE Healthcare.</p>`,
    coaching:"Keep this crisp and confident. The 'what breaks if this is late' framing shows you think about integration risk sequencing — which is exactly the project management mindset they need.",
    resumeKeys:["maestrogrid","rhea"],
    jdKeys:["project_mgmt"]
  }
],

hm:[
  {
    category:"Disposition Strategy",
    q:"Walk me through exactly how you'd develop supplier disposition recommendations across a large, diverse acquired supplier base.",
    a:`<p class="story-hook">When I joined Maestrogrid, the environment was so decentralized it felt like a Day 1 acquisition scenario — the contract repository didn't match actual AP spend by about 40%. So I've essentially built this process from scratch once already.</p>

<p><strong>Phase 1 is Data Triangulation.</strong> I pull 12 months of AP data, cross-reference it against the contract repository, and map it against GE Healthcare's enterprise supplier list. The goal isn't a clean spreadsheet — it's finding the surprises. The vendor nobody contracted formally but accounts for $600k in invoices. The enterprise software renewal expiring in 60 days that nobody flagged. Those are the integration landmines.</p>

<p><strong>Phase 2 is Overlap Analysis.</strong> For each supplier category, I'm looking at four buckets: Consolidate — they both use the same CRM on different instances, straightforward merge. Retain — a niche clinical vendor with no GEHC equivalent, patient care dependency, you keep it. Exit — they use a secondary analytics tool where GEHC already has a global enterprise license for a competitor — you replace it and capture the savings. Re-source — it's a category where neither the legacy nor the enterprise standard is adequate, so you go to market fresh.</p>

<p><strong>Phase 3 is Contract Mechanics.</strong> The disposition recommendation has to be commercially executable, not just strategically ideal. I review every high-spend supplier's assignment clauses and termination provisions. If we want to exit a vendor but terminating early triggers a $400k penalty, that changes the NPV of 'Exit' versus letting the contract run to natural expiry.</p>

<div class="story-data">Then I bring the full disposition roadmap to the steering committee — Legal, Finance, IT, the business owners — and we debate the edge cases. The goal isn't unanimous consensus on every supplier. It's a shared, data-backed decision that everyone can execute against. That's how you get a disposition strategy that actually sticks.</div>`,
    coaching:"Show the step-by-step mechanics. Interviewers at this level want to see that you've actually built this process before — the 40% data mismatch detail from Maestrogrid makes it real and credible.",
    resumeKeys:["maestrogrid","krystal"],
    jdKeys:["disposition_strategy","project_mgmt","integration_scope"]
  },
  {
    category:"IT & Software Risks",
    q:"What are the specific commercial and compliance risks you look for when consolidating software vendors after an acquisition?",
    a:`<p>Software is where the most expensive integration mistakes live, and they usually fall into three categories.</p>

<p><strong>First: Change of Control and Assignment clauses.</strong> A lot of SaaS vendors embed organizational change triggers in their agreements — sometimes deliberately, because acquisitions are when they reset pricing. We need to know immediately which contracts require the vendor's written consent to assign the licenses to GE Healthcare, and which treat the acquisition as a change of control that lets them terminate or renegotiate. I flag these on Day 1 and get Legal into the room before we communicate anything to those vendors.</p>

<p><strong>Second: Enterprise licensing scope and true-up mechanics.</strong> The question isn't just 'do we both use this software' — it's 'does GE Healthcare's enterprise agreement definition automatically cover the acquired entity?' Sometimes it does. Sometimes 'Enterprise' is explicitly limited to specific legal entities or geographies, and every new user from the acquisition triggers a true-up at list price. I've seen that cost seven figures. The mitigation is negotiating a blanket amendment before the integration date lands.</p>

<p><strong>Third: Data security and regulatory compliance posture.</strong> Coming from Plural Health, I know clinical software isn't just a commercial negotiation — it's a compliance audit. If we're retaining an acquired company's vendor, they inherit GE Healthcare's InfoSec standards. I work with the Data Privacy and IT Security teams on Day 1 to gap-assess every high-spend retained vendor against our SOC 2, HIPAA, and where applicable ISO 13485 requirements. Vendors who fail go from the Retain list to the Exit list immediately, and we begin a transition plan before the business even knows there's a problem.</p>`,
    coaching:"Name the specific landmines. Change of Control, true-up mechanics, and InfoSec posture are the three that actually kill integrations. This level of specificity separates you from candidates who just say 'I review the contracts'.",
    resumeKeys:["maestrogrid","plural","skills"],
    jdKeys:["risk_mgmt","integration_scope","execution"]
  },
  {
    category:"Lean/Six Sigma",
    q:"The JD calls out Lean/Six Sigma experience. How do you apply process improvement to complex sourcing projects?",
    a:`<p>Lean, for me, isn't a certification exercise — it's a framework for eliminating the things that slow down good decisions.</p>

<p>In an integration context, the biggest waste I see consistently is 'over-processing' at the contract review stage. Teams treat every vendor agreement as a bespoke legal project and try to review hundreds of contracts with the same depth and timeline. That's how integrations fall behind schedule by Month 2.</p>

<p>What I do instead is build a triage matrix. Contracts get categorized by two axes: spend tier and risk level. Low-spend, low-risk indirect vendors — a regional office supplies contract, a basic SaaS tool with no data sharing — get a streamlined, fast-tracked review. Two days, standard checklist, done. High-spend, high-risk IT platforms and clinical software get the full deep-dive gate: Legal, InfoSec, and Sourcing all in the room.</p>

<div class="story-data">At Maestrogrid, this kind of standardization cut our category onboarding cycle from roughly six weeks to about three and a half — a 40% reduction — purely by eliminating the waiting time between handoffs. In PMI terms, that's the difference between hitting your 90-day synergy target and explaining to the CFO why you're running 60 days behind.</div>

<p>The Lean principle underneath it is simple: you don't make everything faster, you make the right things faster. You protect quality where the risk justifies it and eliminate waste everywhere else.</p>`,
    coaching:"Anchor the Lean answer in a concrete outcome — the 40% cycle time reduction. Abstract methodology answers don't land at this level. Specific numbers do.",
    resumeKeys:["maestrogrid","skills"],
    jdKeys:["project_mgmt","execution"]
  },
  {
    category:"Cross-functional Conflict",
    q:"Tell me about a time you had to align Finance, Legal, and IT on a single sourcing decision where they had completely different priorities.",
    a:`<p class="story-hook">There's a specific moment at Rhea Carrison that I think about whenever cross-functional alignment breaks down — because it taught me the most important rule: never let a governance meeting become a debate. Make it a decision about data.</p>

<p>I was leading a major technology sourcing initiative. IT wanted the fastest possible implementation — they had a product roadmap depending on it. Finance wanted a 10% cost reduction — their CFO had committed to it publicly. And Legal needed incredibly stringent compliance terms because the software handled employee data across three jurisdictions.</p>

<p>If I'd tried to mediate between them, we'd still be in that meeting room. Instead, I built a TCO model that quantified the trade-offs into actual numbers. Option A: meets IT's timeline, falls 4% short of Finance's target, creates a moderate compliance risk that Legal estimated at a $200k potential liability. Option B: hits the savings target, extends implementation by three weeks, fully satisfies Legal's requirements. Option C: compromises on all three, satisfies none.</p>

<div class="story-data">I put those three options in front of the steering committee and let the data do the work. Finance said: 'We'll take the slightly lower yield in exchange for Legal capping our liability.' IT said: 'Three weeks is manageable if Legal gets their terms.' Legal said: 'We're in.' Total alignment time: 45 minutes. The secret wasn't my negotiation skills — it was that I gave them a framework to make a shared decision instead of a platform to win an argument.</div>`,
    coaching:"The 'make it a decision about data, not a debate' framing is the most mature answer to cross-functional conflict questions at this level. The story from Rhea Carrison has all the elements: concrete conflict, structured resolution, measurable outcome.",
    resumeKeys:["rhea"],
    jdKeys:["governance","project_mgmt"]
  },
  {
    category:"Negotiations",
    q:"How do you prepare for a critical negotiation in an integration context — particularly when you're trying to absorb an acquired company's volume into a GEHC enterprise agreement?",
    a:`<p>Preparation is the negotiation. By the time you're sitting across from the vendor, the leverage work is already done — or it isn't.</p>

<p>My preparation process in an integration context has four components. First, I establish the full spend picture: what GE Healthcare is currently paying, what the acquired entity is paying, and whether the combined volume qualifies us for a tier we weren't in before. Software vendors almost always have volume tiers with significant pricing breaks — finding those thresholds is often where the quick wins live.</p>

<p>Second, I calculate the BATNA with precision. In a consolidation scenario, the BATNA is usually migrating users onto our existing enterprise platform. I build that cost model: migration engineering hours, potential productivity disruption, contractual switching costs. If migrating costs $180k and takes three months, that becomes my walk-away threshold in the negotiation. Below $180k in incremental savings, I'm better off with the status quo.</p>

<p>Third, I map the vendor's incentives. Are they in their fiscal Q4? Have they been losing enterprise clients to a competitor? Do they desperately want the GE Healthcare logo on their case studies? The vendor who needs this deal as much as you do negotiates completely differently from the one in a position of strength.</p>

<div class="story-data">Fourth — and this is specific to integration — I decide in advance what I'm putting on the table. Sometimes the most powerful move is not negotiating the acquired entity's contracts in isolation, but putting GEHC's entire global agreement on the table and saying: partner with us to absorb these users at our enterprise rate, or we rationalise the entire architecture to your competitor. That threat is only credible if the CIO's office is aligned. That's why I get IT in the room before I ever talk to the vendor.</div>`,
    coaching:"Use the word BATNA — it signals commercial sophistication. The 'threat only works if the CIO is aligned' detail shows you understand that negotiation leverage in M&A is cross-functional, not just commercial.",
    resumeKeys:["maestrogrid","fitc","skills"],
    jdKeys:["execution","disposition_strategy"]
  },
  {
    category:"Resistance",
    q:"A business leader insists on keeping their legacy vendor that you've recommended for consolidation. How do you handle it?",
    a:`<p>The instinct is to escalate. The instinct is wrong.</p>

<p>When a business leader pushes back on a consolidation recommendation, they're almost never being irrational — they have a legitimate operational concern that I haven't fully understood yet. Maybe their legacy vendor has a custom API integration that took 18 months to build. Maybe the vendor's SLA has a penalty clause that actually protects them in ways our enterprise standard doesn't. Maybe it's just that they watched a previous consolidation go badly and don't trust the process.</p>

<p>My first move is always to understand what they're actually protecting. I sit down with them — not with a slide deck, just a conversation — and ask them to walk me through what would actually break if we made this switch. I take notes. I come back with data.</p>

<p>Then one of two things happens. Either their operational concern is legitimate, in which case I change my recommendation. If our enterprise standard genuinely cannot replicate a capability they depend on, 'Retain' is the right answer. Business continuity has to outrank synergy savings. I'm not here to force consolidation for its own sake.</p>

<div class="story-data">Or — more often — the concern is addressable. I build a capability matrix: their legacy vendor side by side with the GEHC enterprise standard, mapped against every requirement they raised in our conversation. I show them where the enterprise standard meets or exceeds the legacy vendor, and where we need a transition plan to bridge any gap. I frame the conversation as: we're not taking away your vendor — we're upgrading you to a platform with GEHC's enterprise security, global SLA, and commercial terms. Most reasonable people, given that framing and that data, come around.</div>`,
    coaching:"Never start with 'I enforce the policy.' That's how you create enemies. The 'what would actually break' opening question signals empathy, builds trust, and often reveals the legitimate concern hiding behind the resistance.",
    resumeKeys:["rhea","plural"],
    jdKeys:["governance","disposition_strategy"]
  },
  {
    category:"Healthcare Compliance",
    q:"When integrating clinical software or IT systems in a healthcare setting, what compliance risks do you prioritise?",
    a:`<p>Clinical IT integration is a completely different risk category from standard corporate software — and underestimating that difference is how companies end up on the front page of a data breach story.</p>

<p>My Day 1 compliance checklist for any software touching patient data or clinical workflows starts with three things. First, PHI data flows. I map exactly which vendors have access to Protected Health Information — not just the obvious EHR systems but anything that touches patient scheduling, billing, lab results, or device data. Every one of those vendors needs a formal Business Associate Agreement with GE Healthcare before we retain them.</p>

<p>Second, I partner with InfoSec to gap-assess every retained vendor against our SOC 2 Type II requirements and, for medical device software, the applicable ISO 13485 certifications. If a vendor can't produce current attestation documentation, they go on the emergency remediation list — not the 'we'll deal with it later' list. PIPEDA and HIPAA violations have fines that make the synergy savings look irrelevant.</p>

<div class="story-data">Coming from Plural Health, the experience that shaped my thinking most was a contract renewal for a clinical data platform where the vendor had let their SOC 2 certification lapse during a company transition. From the outside, everything looked fine — they were performing well, the relationship was good. It was only when I did the routine audit that we found the gap. We had to execute an emergency compliance amendment and give them 60 days to recertify before we'd process any new patient data through the platform. That close call is why I build compliance review into the very first phase of any integration assessment — not as a checklist item, but as an actual gate.</div>`,
    coaching:"The Plural Health story about the lapsed SOC 2 certification is gold — it shows you caught a real compliance risk that others would have missed. That's exactly the experience GEHC needs given their clinical software portfolio.",
    resumeKeys:["plural","skills"],
    jdKeys:["risk_mgmt","integration_scope"]
  }
],

tp:[
  {
    category:"Panel Introduction",
    q:"Introduce yourself to our cross-functional panel — Legal, Finance, IT, and Sourcing are all in the room.",
    a:`<p>Thank you for having me. I know we have different functions represented today, so I want to speak to what this project means for each of your teams — not just to Sourcing.</p>

<p>I have over a decade of experience in strategic sourcing, with a particular depth in IT software, external labour, and complex indirect categories. I've built enterprise category management frameworks from scratch, led multi-region vendor consolidations, and managed procurement in regulated healthcare environments. What I haven't held is an official 'M&A Integration Lead' title — but I want to be upfront about that, because I think you'll find that the work is identical.</p>

<p>When I joined Maestrogrid, I inherited a decentralized procurement environment that looked like Day 1 of an acquisition: fragmented contracts, shadow purchasing, no master supplier list, no governance structure. I built it. When I was at Rhea Carrison, I led multi-region vendor rationalisations that required getting Finance, HR, and IT leaders to change entrenched supplier relationships — against significant resistance — using data and a clear governance framework rather than corporate mandates.</p>

<div class="story-data">Here's what I'd say to each function in this room. To Legal: I know you have risk and liability concerns that procurement often underweights — in my experience, integrating your requirements as deal structure rather than post-execution review changes outcomes significantly. To Finance: every disposition recommendation I make includes a TCO model and a synergy tracking mechanism so the savings hit the budget, not just the slide deck. To IT: I build integration strategies around architecture end-state, not just commercial optimisation — I need you in the room early, not as an approver at the end. To Sourcing: I operate as a project management layer that gives your category managers visibility and removes blockers, not as an additional layer of bureaucracy.</div>`,
    coaching:"Panel introductions need to speak to each audience simultaneously. The four-part closing — addressing Legal, Finance, IT, and Sourcing individually — is unusual and memorable. It signals executive maturity.",
    resumeKeys:["maestrogrid","rhea","plural"],
    jdKeys:["governance","integration_scope","project_mgmt"]
  },
  {
    category:"90-Day Plan",
    q:"Walk us through your 90-day integration plan as Sourcing Lead.",
    a:`<p>I use standard PMI workstream planning — three phases, each with a clear deliverable that feeds the next.</p>

<p><strong>Days 1–30: Discover and Baseline.</strong> My only goal in Month 1 is to establish a single source of truth that everyone trusts. I'll pull AP spend data for the trailing 12 months, cross-reference it against the contract repository, and map it against GE Healthcare's master vendor list. I'll run a gap analysis — which suppliers appear in spend data but have no contracts, which contracts are expiring in the next 180 days, which vendors have Change of Control clauses we need to manage immediately.</p>

<p>Simultaneously, I'll schedule one-hour briefings with each function in this room. Not status meetings — intelligence gathering sessions. What are your critical vendor dependencies? What's already broken? What's the one thing that cannot be disrupted under any circumstances? That gives me the risk parameters for the disposition strategy.</p>

<p><strong>Days 31–60: Strategize and Align.</strong> Once the data is clean, I build the disposition recommendations across all supplier categories — Consolidate, Retain, Exit, Re-source. I'll bring those recommendations to a structured governance forum with Legal, Finance, IT, and the business. For the complex edge cases — the legacy vendors with high business attachment, the software platforms with compliance gaps — we'll have working sessions that end with a recorded decision, not an open action item.</p>

<p><strong>Days 61–90: Execute and Report.</strong> Month 3 is execution. Straightforward renewals and amendments get processed immediately to secure continuity. For complex consolidations, I'll build the negotiation briefs and BATNA models to support the senior sourcing leaders driving those deals. I'll establish a weekly executive reporting cadence — not a status dump, but three things: synergies captured this week, milestones completed, and the top three risks that need executive attention or a decision.</p>

<div class="story-data">The thing I'd want this panel to know about my approach is that I won't let perfect be the enemy of good. In an integration, some decisions have to be made with 70% of the information you'd ideally want. The 90-day plan exists to make sure those decisions are made deliberately and documented, not by default.</div>`,
    coaching:"The 90-day plan is always the signal PMI question. Breaking it into three phases with clear deliverables — not just vague actions — shows PMI process maturity. The 'not let perfect be the enemy of good' closing is honest and demonstrates integration experience.",
    resumeKeys:["maestrogrid","krystal"],
    jdKeys:["integration_scope","disposition_strategy","project_mgmt","execution"]
  },
  {
    category:"TSA Management",
    q:"How would you approach managing Transition Service Agreements — especially given GE Healthcare's recent spin-off experience?",
    a:`<p>TSAs are effectively the integration's countdown clock — and the single biggest project management risk if they're not tracked obsessively from Day 1.</p>

<p>I haven't managed a formal TSA exit before, so I want to be honest about that. But I understand exactly what they represent: a temporary commercial bridge that expires on a hard date, with extension penalties that can be punitive, while simultaneously you're trying to stand up permanent IT infrastructure and new commercial agreements with vendors whose licenses may have been held by the parent entity and can't be assigned.</p>

<p>My approach would be to treat every TSA-bound vendor as a hard-deadline sourcing event. First, I'd map all software licenses and IT services that are governed by the TSA and identify which can be assigned to GE Healthcare versus which require net-new agreements. For the net-new agreements, the sourcing timeline has to be completed months before the TSA expiry date — because IT needs time for data migration, testing, and cutover that has nothing to do with how quickly I can execute a contract.</p>

<div class="story-data">The thing I'd want to understand quickly in this role is: where in the TSA inventory does GE Healthcare's institutional experience from the 2023 spin-off live? Because that knowledge — which vendor categories caused the most friction during separation, which assignment negotiations got contentious, which vendors tried to force a price reset — is invaluable intelligence for how we approach a new integration. I'd want to build on that institutional memory rather than rediscovering those lessons the expensive way.</div>`,
    coaching:"Acknowledging the gap honestly and then immediately showing you understand the mechanics at a sophisticated level is more credible than pretending you've managed TSAs before. The question about institutional memory from the spin-off shows strategic thinking.",
    resumeKeys:["maestrogrid","skills"],
    jdKeys:["project_mgmt","disposition_strategy","execution","risk_mgmt"]
  },
  {
    category:"Communication & Reporting",
    q:"How do you keep a complex cross-functional integration on track without creating meeting fatigue?",
    a:`<p>The rule I operate by is: status is async, decisions are synchronous.</p>

<p>Every week, I send a single-page executive summary — three sections, never longer. What we completed this week. The synergies captured or commitments secured. The top three risks or blockers that need a decision or escalation. That's it. It goes to everyone on the steering committee, it goes in the same format every time, and it can be read in 90 seconds. People actually read it because they trust that if something needs their attention, it's in there. If it's not in there, they don't need to worry about it.</p>

<p>The master supplier roadmap lives in a shared document that every stakeholder can access in real time. Supplier name, category, disposition status, target completion date, owner, dependencies. It's the single source of truth and it's always current. I update it every Friday. No one needs to ask me 'where are we on Vendor X' — they can see it themselves.</p>

<div class="story-data">When I call a governance meeting, it's for one of three things only: a decision that needs executive sign-off, a risk escalation where I need resources or political cover, or a cross-functional conflict I can't resolve at my level. I send the working document 48 hours in advance. I start the meeting with the pre-read section done and spend the hour on the actual decision. People start looking forward to those meetings because they end with a clear outcome, not another meeting to schedule.</div>`,
    coaching:"The 'status is async, decisions are synchronous' principle is the most sophisticated PMI communication answer you can give. It signals that you've run complex projects and know exactly why meeting fatigue happens and how to prevent it.",
    resumeKeys:["krystal","rhea"],
    jdKeys:["project_mgmt","governance"]
  },
  {
    category:"Sourcing Best Practices",
    q:"The JD emphasises applying 'sourcing best practices' across the integration. What does rigorous sourcing methodology look like in practice?",
    a:`<p>Best practices in an integration context means refusing to let urgency become an excuse for shortcuts — and knowing which shortcuts are genuinely safe versus which ones will cost you later.</p>

<p>The 7-step strategic sourcing framework is my structural backbone. Even in a fast-moving integration, I don't skip steps — I accelerate them. Assessment means validating the spend data myself, not accepting exported reports at face value. I've seen 'clean' data that was off by 40% because nobody had reconciled AP actuals against contract commitments in two years. Strategy means building the disposition matrix on Total Cost of Ownership — not unit price, not relationship history, but what does this supplier relationship actually cost us fully loaded over three years.</p>

<p>Execution means using structured RFPs even when an incumbent is the likely outcome. If a vendor knows we're reviewing their position as part of an integration, forcing them through a competitive process — even a shortened one — disciplines their pricing in ways that a simple renewal never does. I've seen incumbents sharpen their pencils by 15-20% simply because they knew we'd asked their competitors to bid.</p>

<div class="story-data">The best practice that matters most in integration specifically is synergy tracking all the way to the budget. I've seen integrations where Sourcing celebrated a $3M consolidated savings number on a slide deck, and six months later Finance couldn't find it in the actual numbers because nobody closed the loop between the contract execution and the budget adjustment. My standard is: every synergy is tracked from commercial commitment to budget impact, reconciled with Finance quarterly. If it doesn't show up on the P&L, it didn't happen.</div>`,
    coaching:"The synergy tracking to budget detail is the thing most candidates miss. It shows finance-grade rigour and is exactly what CFOs ask about when integration synergies fail to materialise.",
    resumeKeys:["fitc","rhea","skills"],
    jdKeys:["integration_scope","execution","project_mgmt"]
  }
],

vp:[
  {
    category:"Strategic Vision",
    q:"How do you see the role of Sourcing Integration Lead within the broader corporate transition strategy?",
    a:`<p>The board will measure this integration's success on synergy savings. But the thing that can destroy value faster than any synergy can create it is operational disruption — and that's where Sourcing sits.</p>

<p>If a critical software license doesn't transfer properly and a clinical workflow goes dark for two weeks, the cost of that disruption will dwarf whatever licensing savings we were going to capture. If a key vendor walks away because of a contract dispute during the transition, the cost to re-onboard an equivalent is almost always greater than the cost of the deal we turned down. The integration creates enormous risk — legal, commercial, operational — before it creates a single dollar of savings.</p>

<p>So I view the Integration Sourcing Lead's primary mandate as protecting business continuity first. That means getting ahead of the Change of Control risks, securing the bridging amendments, ensuring every critical vendor is formally notified and commercially stable. Synergy capture comes second — but it comes a close second, and it's tracked with the same rigour as the risk work.</p>

<div class="story-data">The framing I find most useful is: Sourcing is the commercial bridge between two companies. We don't own the integration strategy — that belongs to the M&A team and the executive committee. We don't own the IT architecture — that belongs to the CIO. What we own is the commercial execution layer that keeps everything running while the structural integration happens around it. Done well, that's an enormously valuable function. Done poorly, it's the thing that causes executive leadership to wonder why the integration is two quarters behind schedule and $12M over cost.</div>`,
    coaching:"VP conversations need to start with the enterprise stakes. 'Protecting business continuity first, synergy capture second' is the answer that demonstrates strategic maturity and shows you understand what integration failure actually looks like.",
    resumeKeys:["maestrogrid","rhea"],
    jdKeys:["integration_scope","risk_mgmt","disposition_strategy"]
  },
  {
    category:"Enterprise Leadership",
    q:"You'll be leading cross-functional execution at the LPB level without direct reporting authority. How do you drive accountability?",
    a:`<p>Direct authority is actually a relatively weak form of accountability. People do things because they're told to, and the moment the mandate is ambiguous or competing priorities emerge, the project stalls. The kind of accountability that actually moves enterprise projects forward is based on shared goals and transparent consequences.</p>

<p>In practice, I do three things. First, I make sure every stakeholder's personal success metric is connected to the integration outcome. If a business unit leader's annual review depends on the technology consolidation landing on time, they'll find the three hours a week to engage seriously. I work with sponsors to make those connections visible at the start of the project, not after it's running late.</p>

<p>Second, I use the master supplier roadmap as a public accountability tool. When a workstream is behind schedule, it shows up in the executive summary — not as an accusation, but as a fact. 'The CRM consolidation is four weeks behind target due to IT resource constraints. Recommended resolution: temporary engineer allocation or six-week timeline extension.' I give executives the information they need to make a decision. Most of the time, the act of surfacing the delay with a proposed solution is enough to unlock the resource.</p>

<div class="story-data">Third — and this is the one that matters most — I protect my own credibility ruthlessly. I don't overcommit. I don't tell a VP we'll capture $4M in synergies by Q2 unless I have line-of-sight to each dollar and the contract work to back it up. The fastest way to lose influence in a matrixed organization is to become known as someone whose numbers can't be trusted. My reputation for commercial accuracy is the most important accountability mechanism I have — because it's what makes executives take my recommendations seriously when the hard calls come.</div>`,
    coaching:"The 'direct authority is a weak form of accountability' opening reframes the question in a sophisticated way. The credibility/accuracy closing is unusually candid and memorable — it signals executive maturity rather than the standard 'I build relationships' answer.",
    resumeKeys:["rhea","krystal"],
    jdKeys:["project_mgmt","governance"]
  },
  {
    category:"Synergy Capture",
    q:"How do you maximise synergy savings from software and IT vendors specifically — especially given that vendors often try to use transitions as a repricing opportunity?",
    a:`<p>Software vendors view acquisitions the way sharks view a swimmer in distress. The commercial predator move is to treat every new user as 'net new,' demand a true-up at list price, and frame the enterprise as lucky to have them. Countering that effectively requires a very specific sequence.</p>

<p>First, you move fast. Every week you wait after the acquisition closes is a week the vendor has to prepare their repricing strategy. I get to the high-spend software vendors in the first 30 days with a clear message: GE Healthcare is rationalising its architecture across the combined entity, and we are reviewing all incumbent positions as part of that process. That sentence changes the negotiation dynamic immediately. We're not coming to ask for their help; we're telling them they need to earn the combined volume.</p>

<p>Second, I don't negotiate the acquired entity's contracts in isolation. I put GE Healthcare's entire enterprise agreement on the table. The combined volume creates tier pricing leverage that neither company had independently — and most enterprise software agreements have volume bands we've never reached before. I find those thresholds in the first week and I use them as the anchor for every vendor conversation.</p>

<div class="story-data">Third — and this is critical — the credibility of the commercial threat depends entirely on the CIO being aligned. If I tell a software vendor 'we'll migrate the entire architecture to your competitor' and IT isn't actually ready to do that, the vendor will call the bluff. I don't make threats I can't execute. Every major consolidation conversation I lead, I've first gotten the architecture team to confirm the alternative is genuinely viable. That alignment is what turns a negotiating position into genuine leverage.</div>`,
    coaching:"The 'sharks view a swimmer in distress' opening is memorable and immediately signals that you've lived through this dynamic. The CIO alignment closing shows you understand that commercial leverage in M&A is never just a procurement conversation.",
    resumeKeys:["maestrogrid","skills"],
    jdKeys:["execution","disposition_strategy","integration_scope"]
  },
  {
    category:"Precision Care Strategy",
    q:"GE Healthcare is acquiring AI and digital health companies as part of its Precision Care strategy. How does your sourcing approach adapt when integrating these targets?",
    a:`<p>The Precision Care acquisitions are a fundamentally different integration thesis than traditional cost synergy plays — and getting that distinction wrong is how you accidentally destroy the thing you just paid to acquire.</p>

<p>When GE Healthcare acquires an AI imaging startup or a digital health platform, they're paying for two things: the technology and the engineering culture that built it. Both are fragile. Both can be damaged by an integration approach that treats the acquisition like a back-office consolidation exercise.</p>

<p>So my sourcing strategy in those environments operates on a two-track model. For back-office categories — HR platforms, basic cloud infrastructure, office tools — yes, we aggressively consolidate to GE Healthcare's enterprise standards. Those synergies are real, they're straightforward, and there's no strategic reason to maintain two separate HR systems.</p>

<p>But for the core R&D technology stack — the AI development platforms, the specialized clinical data repositories, the ML infrastructure the engineers built their models on — the disposition strategy is almost always Retain, at least in the first 12 to 18 months. I work directly with the acquired company's CTO to understand what tools their developers need to maintain velocity. I focus my sourcing involvement on risk mitigation: ensuring those vendors meet GE Healthcare's InfoSec and FDA/Health Canada compliance requirements, not disrupting the workflows in the service of saving a few points on a license fee.</p>

<div class="story-data">The strategic principle is simple: you can always consolidate a back-office platform later. You can't un-lose the engineering talent that left because the integration disrupted their toolchain. Sourcing's role in a Precision Care acquisition is to build a compliant, scalable foundation that lets the acquired team accelerate — not to slow them down with legacy procurement bureaucracy while their best engineers are getting calls from competitors.</div>`,
    coaching:"This is the answer that demonstrates you've studied GE Healthcare's strategy, not just the job description. Referencing Precision Care by name and understanding the AI acquisition thesis shows strategic awareness that most procurement candidates won't have.",
    resumeKeys:["rhea","plural"],
    jdKeys:["integration_scope","governance","disposition_strategy"]
  },
  {
    category:"Recovery",
    q:"A major workstream — say, the consolidation of a critical clinical software platform — is eight weeks behind schedule. What do you do?",
    a:`<p>The first thing I do is stop the bleeding commercially, before I even diagnose the cause of the delay.</p>

<p>If the consolidation is eight weeks behind and the legacy contract is expiring or a TSA clock is running, the business continuity risk is immediate. I engage the legacy vendor to secure a bridging extension — a short-term amendment that keeps the lights on while we resolve the underlying problem. I don't care about the cost of that extension in the moment. The cost of the clinical platform going dark for two days is orders of magnitude higher.</p>

<p>Once continuity is secured, I run a rapid root-cause sprint with the core team. Eight weeks of delay doesn't happen in one day — someone saw it coming earlier and either didn't escalate or escalated to someone who didn't act. I need to understand which it was. Is this an IT resource constraint? A data migration complexity we underestimated? A vendor who isn't performing? A compliance issue that emerged during due diligence? The root cause determines the solution.</p>

<p>Then I take it to the governance committee — not as a problem report, but as a decision brief. 'We are eight weeks behind on the clinical CRM consolidation due to data mapping complexity. Option A: allocate four additional IT engineers for a focused six-week sprint, gets us back on schedule at a cost of approximately $120k in contractor time. Option B: extend the legacy contract by three months and compress the consolidation timeline through a phased migration approach. Here are the risk profiles of each option. I need a decision this week.'</p>

<div class="story-data">The thing I'm careful about is never walking into an executive conversation with just a problem. Anyone can be the person who surfaces the delay. What earns trust at this level is being the person who surfaces the delay and immediately tells the executive exactly what they need to do to fix it. That's the job.</div>`,
    coaching:"The sequence matters here: business continuity first, root cause second, escalation with options third. The 'never walk in with just a problem' closing is the executive maturity signal that separates LPB candidates from senior individual contributors.",
    resumeKeys:["rhea","skills"],
    jdKeys:["project_mgmt","risk_mgmt","execution"]
  }
],

gaps:[
  {
    category:"The Direct Gap",
    q:"You haven't held an official M&A Integration title. Why should we choose you over a candidate who has?",
    a:`<p>It's a fair question and I want to answer it directly rather than deflect.</p>

<p>The honest case for me is this: I've been doing the actual work of M&A integration — supplier rationalization, master supplier list construction, disposition strategy development, cross-functional governance, TSA mechanics — in environments that structurally required it, even when the label wasn't there. Maestrogrid hired me to walk into a decentralized, fragmented procurement environment and build order out of it. That's not a different skill set from integration work. It's the same skill set, applied in a context that didn't have an acquisition to explain why everything was fragmented.</p>

<p>A candidate with an official M&A title has done this work with the explicit context and the institutional support that comes with a formal program office. That's a real advantage, and I'm not going to pretend it isn't. What they may not have is experience building integration frameworks in environments where the infrastructure doesn't exist — where you're triangulating data from three different systems because nobody ever built the single source of truth, where you're building governance from a blank page rather than inheriting a playbook.</p>

<div class="story-data">My question for you would be: what does this integration actually look like on the ground? Is it a well-resourced program with a mature PMO and established governance, in which case a candidate with a specific M&A track record is probably a better fit? Or is it an environment where the sourcing lead is going to have to build as much as they execute — because if it's the latter, that's exactly the context I've spent my career in, and I think you'll find I'm more ready for it than my title history suggests.</div>`,
    coaching:"Never get defensive about the gap. The 'counter-question back to the interviewer' close is brilliant — it reframes the conversation and shows you've genuinely thought about where you do and don't fit. Confident, not combative.",
    resumeKeys:["maestrogrid","rhea"],
    jdKeys:["integration_scope","project_mgmt"]
  },
  {
    category:"Weaknesses",
    q:"What is your biggest professional weakness?",
    a:`<p>My tendency is to over-engineer the data analysis before I start communicating.</p>

<p>In practice, this means I've sometimes built a comprehensive TCO model and a full disposition matrix before bringing stakeholders into the conversation — and by the time I present the analysis, they feel like they're being told a conclusion rather than being invited into a decision. The analysis is rigorous, but the process creates the feeling of being presented to, not consulted.</p>

<p>I've been working on this deliberately. At Maestrogrid, I changed my approach to bring stakeholders in at the 'rough cut' stage — when the data is directionally right but not fully refined — specifically to create the experience of a shared discovery rather than a procurement presentation. It means some of the early conversations are messier and I field more 'what if' questions before I have all the answers. But the governance outcomes are better, and the eventual decisions are stickier because the people executing them feel like they helped make them.</p>

<div class="story-data">In an integration context, I'd actually say that weakness is higher-stakes than usual — because the last thing you want is for a business leader to feel like Sourcing has already decided their vendor's fate before the governance conversation. I'm actively more careful about that framing now than I used to be.</div>`,
    coaching:"The weakness is real but professionally relevant — not a fake 'I work too hard' answer. The self-awareness about how it manifests in integration specifically is what makes it credible to an interviewer who knows the space.",
    resumeKeys:["maestrogrid"],
    jdKeys:["governance","project_mgmt"]
  },
  {
    category:"Salary",
    q:"What are your salary expectations for this role?",
    a:`<p>Based on my research on LPB-band Sourcing roles in the GTA and the specific mandate of this position — which combines post-merger integration project leadership with strategic sourcing execution across all categories — I'm targeting a base salary in the range of $130,000 to $145,000 CAD.</p>

<p>That said, I'm most interested in understanding the full compensation structure, including any annual incentive component tied to integration milestones, and whether there's flexibility based on the final scope of the role. An integration project that covers the full supplier landscape with direct executive visibility is a different scope than one that's focused on a single category — and I'd want the compensation to reflect the actual mandate.</p>

<p>I'm not inflexible on the number. What I care most about is that the structure makes sense for a role where the success metrics are clear and the delivery timeline is defined. What's the budgeted range for this position?</p>`,
    coaching:"State a range confidently, explain the rationale briefly, and redirect to the full package and their range. Asking 'what's the budgeted range' at the end is assertive without being aggressive — it signals you've done your research.",
    resumeKeys:["skills"],
    jdKeys:["project_mgmt"]
  },
  {
    category:"Failure Story",
    q:"Tell me about a time a project you led didn't go as planned. What happened?",
    a:`<p>At Rhea Carrison, I led a vendor consolidation initiative across our UK and North American external labour suppliers that came in three months behind schedule and without the full savings target we'd committed to. I want to tell you what actually happened rather than giving you a sanitized version.</p>

<p>The root cause was that I underestimated how deeply embedded one of the UK vendors was in the operational workflow of the regional management team. From a commercial and data standpoint, the consolidation made complete sense — the North American supplier had better rates, stronger SLAs, and a more scalable platform. But I didn't discover until month two that the UK team had built a set of manual integration workarounds over four years that our new vendor's platform didn't natively support. That was a gap I should have caught in the assessment phase, and I didn't ask the right questions.</p>

<p>We ultimately saved the project by negotiating a phased migration that kept the UK vendor active for an additional six months while we rebuilt the integration — which cost us half the projected savings for that fiscal year and the three-month delay.</p>

<div class="story-data">What I changed after that: operational dependency mapping is now the first thing I do before building any consolidation recommendation. I don't just ask 'does this vendor perform?' I ask 'what would break if this vendor went dark tomorrow, and who would be the first to notice?' It's a different question, and it surfaces the invisible dependencies that spreadsheet analysis misses entirely. That failure made me a materially better integration project manager.</div>`,
    coaching:"The best failure stories demonstrate that you've actually learned something — not a cosmetic lesson, but a change in process. The 'what would break if this vendor went dark' question is specific, actionable, and shows genuine learning.",

    jdKeys:["project_mgmt","risk_mgmt","governance"]
  }
]
};

let stage='overview',qIdx=0,mode='practice',revealed=false;
let scores={},customQs={hr:[],hm:[],tp:[],vp:[],gaps:[]};
