As the Integration Lead, my job isn't to guarantee there won't be delays—it's to ensure delays are identified early, mitigated commercially, and resolved with clear executive alignment.`,
      coaching: "Show calm under pressure. Highlight securing the 'fallback position' (bridging amendments) first, then root-cause analysis, then escalating with a solution, not just a problem.",

      a: `To capture real synergies, especially in software, you have to move quickly, because your leverage drops the further you get from the close date.

My first step is identifying the immediate 'quick wins'—overlapping SaaS tools, redundant data subscriptions, and hardware suppliers where our enterprise volume automatically qualifies the acquired entity for our tier pricing. I execute those straightforward amendments and consolidations immediately to get early wins on the board.

The larger value creation comes from the complex enterprise software platforms. Suppliers will often try to treat the acquired entity as 'net new' users to force a true-up at list price. My approach is to leverage the combined scale of the new enterprise. I don't just negotiate the acquired company's licenses; I put our entire global enterprise agreement on the table. I tell the supplier, 'We are rationalizing our architecture. You can either partner with us to absorb these new users at our heavily discounted enterprise rate, or we will pivot the acquired entity to your competitor.' 

You capture IT synergies by asserting the leverage of the parent company immediately, maintaining strict commercial discipline, and partnering lock-step with the CIO's office to ensure our consolidation threats are highly credible.`,
      coaching: "Software vendors are predatory during M&A. Show that you know how to play hardball: combining volume, putting the whole enterprise agreement in play, and making credible threats to shift volume.",

My strategy here is 'Enablement over Interruption.' For core back-office IT—like HR systems or basic cloud storage—we aggressively consolidate to GE Healthcare's enterprise standards to capture those synergies. 

But for their core R&D tech stack—specialized AI development platforms, clinical data repositories, or niche engineering services—my disposition strategy leans heavily toward 'Retain'. I partner with their CTO to understand what tools their developers need to maintain velocity. I focus my sourcing efforts on risk mitigation—ensuring their vendors meet our InfoSec and FDA/Health Canada compliance standards—rather than disrupting their workflows to save a few points on a license.

Sourcing's role in a 'Precision Care' acquisition is to build a compliant, scalable foundation so their engineers can build software faster, not to slow them down with legacy procurement red tape.`,
      coaching: "This is the ultimate 'Executive Vision' answer for GEHC. Recognize their strategic goals (Precision Care/AI) and demonstrate that you know when to be aggressive on synergies (back office) and when to protect the acquired company's agility (R&D).",

const TIPS = [
  { title: "Position as a 'Post-Merger Integration' Leader", body: "Don't just call it 'procurement'. Say 'Post-merger sourcing integration'. Use PMI (Post-Merger Integration) terminology: building a master list is 'standard PMI workstream planning', cross-functional alignment is an 'integration steering structure', and disposition recommendations are 'classic M&A synergy capture'." },

let currentStage = "overview";
let currentQ = 0;
let mode = "practice";
let revealed = false;
let scores = {};
let stageProgress = { hr: 0, hm: 0, tp: 0, vp: 0 };
let searchQuery = '';
let expandedSearchResult = null;
let aiResult = null;
let aiGenerating = false;
let aiDraftQuestion = '';
let aiSelectedStage = 'hm';
let apiKey = '';
let keyVisible = false;
let customQuestions = { hr: [], hm: [], tp: [], vp: [] };

function getQs() { return QUESTIONS[currentStage] || []; }

function renderNav() {
  const nav = document.getElementById("navTabs");
  if (!nav) return;
  nav.innerHTML = STAGES.map(s => {
    const qs = QUESTIONS[s.id];
    const done = qs && qs.length > 0 && stageProgress[s.id] >= qs.length;
    return '<button class="tab-btn ' + (currentStage === s.id ? 'active' : '') + '" onclick="setStage(\'' + s.id + '\')">' +
      s.label + (s.badge ? '<span class="stage-badge ' + s.badgeClass + '">' + s.badge + '</span>' : '') +
      (done ? '<span class="completed-check">&#10003;</span>' : '') +
      '</button>';
  }).join('');
}

function setStage(id) {
  currentStage = id;
  currentQ = 0;
  revealed = false;
  renderNav();
  renderMain();
}

function renderMain() {
  var el = document.getElementById("mainContent");
  if (!el) return;
  if (currentStage === "overview") { el.innerHTML = renderOverview(); renderResumePanel([]); renderJdPanel([]); return; }
  if (currentStage === "tips") { el.innerHTML = renderTips(); renderResumePanel([]); renderJdPanel([]); return; }
  if (currentStage === "search") { renderSearch(); renderResumePanel([]); renderJdPanel([]); return; }
  var qs = getQs();
  if (!qs.length) { el.innerHTML = "<p>No questions.</p>"; return; }
  if (currentQ >= qs.length) { el.innerHTML = renderDone(); renderResumePanel([]); renderJdPanel([]); return; }

  var q = qs[currentQ];
  var pct = Math.round((currentQ / qs.length) * 100);
  var scoreKey = currentStage + "-" + currentQ;
  var picked = scores[scoreKey];
  var rKeys = q.resumeKeys || [];

  // Study mode: always show highlights. Practice mode: only show if answer already revealed
  var showKeys = (mode === 'study' || revealed) ? rKeys : [];
  renderResumePanel(showKeys);
  renderJdPanel(showKeys.length > 0 ? (q.jdKeys || []) : []);

  var revealBtnHtml = mode === "practice"
    ? '<button class="reveal-btn" onclick="revealAnswer()">' + (revealed ? "Hide answer" : "Reveal answer") + "</button>"
    : "";
  var answerVisible = (mode === "study" || revealed) ? " visible" : "";
  var scoreHtml = mode === "practice"
    ? '<div class="score-row"><span style="font-size:12px;color:#888;align-self:center;">How did you do?</span>' +
      '<button class="score-btn easy' + (picked === "easy" ? " picked" : "") + '" onclick="markScore(&apos;easy&apos;)">Nailed it</button>' +
      '<button class="score-btn medium' + (picked === "medium" ? " picked" : "") + '" onclick="markScore(&apos;medium&apos;)">Getting there</button>' +
      '<button class="score-btn hard' + (picked === "hard" ? " picked" : "") + '" onclick="markScore(&apos;hard&apos;)">Need more work</button></div>'
    : "";

  el.innerHTML =
    '<div class="stage-intro">' + getStageIntro(currentStage) + "</div>" +
    '<div class="mode-toggle">' +
      '<button class="mode-btn ' + (mode === "practice" ? "active" : "") + '" onclick="setMode(&apos;practice&apos;)">Practice Mode</button>' +
      '<button class="mode-btn ' + (mode === "study" ? "active" : "") + '" onclick="setMode(&apos;study&apos;)">Study Mode</button>' +
    "</div>" +
    '<div class="progress-bar-wrap">' +
      '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<span class="progress-label">' + (currentQ + 1) + " / " + qs.length + "</span>" +
    "</div>" +
    '<div class="card">' +
      '<div class="card-header">' +
        '<div><div class="q-number">Question ' + (currentQ + 1) + "</div></div>" +
        '<div class="q-category">' + q.category + "</div>" +
      "</div>" +
      '<div class="question-text">' + esc(q.q) + "</div>" +
      revealBtnHtml +
      '<div class="answer-block' + answerVisible + '">' +
        '<div class="answer-label">Strong answer</div>' +
        '<div class="answer-text">' + formatAnswer(q.a) + "</div>" +
        '<div class="coaching-note"><span>Coaching note:</span> ' + esc(q.coaching) + "</div>" +
        scoreHtml +
      "</div>" +
    "</div>" +
    '<div class="nav-controls">' +
      '<button class="nav-btn" onclick="prevQ()" ' + (currentQ === 0 ? "disabled" : "") + ">&larr; Previous</button>" +
      '<button class="nav-btn primary" onclick="nextQ()">' + (currentQ < qs.length - 1 ? "Next question &rarr;" : "Finish stage &rarr;") + "</button>" +
    "</div>";
}

function formatAnswer(text) {
  if (!text) return '';
  // Replace literal '\n' strings that the AI might output with actual newlines, 
  // then split by any sequence of newlines and filter out empty strings
  var cleanText = text.replace(/\\n/g, '\n');
  return cleanText.split(/\n+/).filter(p => p.trim()).map(p => `<p style="margin-bottom:0.85rem">${p.trim()}</p>`).join('');
}

function getStageIntro(stage) {
  const intros = {
    hr: {
      title: "Stage 1 — HR Screening Interview",
      desc: "This is typically a 30-45 minute call with Talent Acquisition. They're assessing fit, project management experience, your understanding of M&A integrations, logistics, and whether to move you forward. Be confident, conversational, and specific about your integration experience.",
      tips: ["Keep answers concise — 90 seconds max", "Highlight IT/Software and cross-functional leadership", "Show enthusiasm for GEHC's 'Precision Care' mission"]
    },
    hm: {
      title: "Stage 2 — Hiring Manager Interview",
      desc: "Your most important interview. They are assessing your technical sourcing depth, how you handle supplier disposition strategy across all categories, your Lean/Six Sigma mindset, and your ability to mitigate IT licensing and clinical compliance risks.",
      tips: ["Use STAR structure", "Walk through data triangulation for master supplier lists", "Reference healthcare compliance (HIPAA/PIPEDA)"]
    },
    tp: {
      title: "Stage 3 — Team / Panel Presentation",
      desc: "You may present to a cross-functional panel (Legal, Finance, IT). They're assessing executive presence, communication clarity, and how you drive governance and alignment across competing priorities in complex projects.",
      tips: ["Provide a clear 90-day plan", "Acknowledge competing priorities across departments", "Mention TSA (Transition Service Agreement) management"]
    },
    vp: {
      title: "Stage 4 — VP / Executive Interview",
      desc: "This is typically a 30-45 minute conversation with a VP or CPO. They're assessing strategic maturity, enterprise thinking, and how you as a Lead Professional Band (LPB) driver can protect the overall value of an acquisition.",
      tips: ["Think out loud on complex questions", "Elevate sourcing to a business continuity enabler", "Align sourcing strategy with GEHC's AI/Digital Health acquisitions"]
    }
  };
  const i = intros[stage];
  if (!i) return '';
  return `<h2>${i.title}</h2><p>${i.desc}</p><div class="tips">${i.tips.map(t => `<span class="tip-chip">${t}</span>`).join('')}</div>`;
}

function renderOverview() {
  const totalQ = Object.values(QUESTIONS).reduce((a, b) => a + b.length, 0);
  const attempted = Object.keys(scores).length;
  const nailed = Object.values(scores).filter(s => s === 'easy').length;
  const working = Object.values(scores).filter(s => s === 'medium').length;
  const tough = Object.values(scores).filter(s => s === 'hard').length;

  return `
    <div class="stage-intro">
      <h2>Welcome, Tolulope</h2>
      <p>This is your personal interview preparation coach for the <strong>Sourcing Integration Project Lead</strong> role. All answers are grounded in your actual resume, the integration/M&A job description, and strategic sourcing best practices. Work through each stage in order, or jump to any stage you want to focus on.</p>
    </div>
    <div class="overview-grid">
      <div class="stat-card"><div class="stat-label">Total questions</div><div class="stat-val">${totalQ}</div><div class="stat-sub">across 4 interview stages</div></div>
      <div class="stat-card"><div class="stat-label">Attempted</div><div class="stat-val">${attempted}</div><div class="stat-sub">questions practiced</div></div>
      <div class="stat-card"><div class="stat-label">Nailed it</div><div class="stat-val" style="color:#2e7d32">${nailed}</div><div class="stat-sub">strong answers</div></div>
      <div class="stat-card"><div class="stat-label">Need work</div><div class="stat-val" style="color:#a32d2d">${tough}</div><div class="stat-sub">flag for review</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:1.5rem">
      ${["hr","hm","tp","vp"].map(s => {
        const qs = QUESTIONS[s];
        const done = Object.keys(scores).filter(k => k.startsWith(s+'-')).length;
        const pct = Math.round((done / qs.length) * 100);
        const labels = { hr: "HR Screen", hm: "Hiring Manager", tp: "Team Panel", vp: "VP Executive" };
        return `<div class="stat-card" style="cursor:pointer" onclick="setStage('${s}')">
          <div class="stat-label">${labels[s]}</div>
          <div class="stat-val">${qs.length} <span style="font-size:14px;font-weight:400;color:#888">questions</span></div>
          <div style="margin-top:8px;height:4px;background:#e0ddd6;border-radius:2px;overflow:hidden"><div style="width:${pct}%;height:100%;background:#0a2d5e;border-radius:2px"></div></div>
          <div class="stat-sub" style="margin-top:4px">${done}/${qs.length} attempted</div>
        </div>`;
      }).join('')}
    </div>
    <div class="stage-intro" style="background:#f0f4ff;border-color:#b5d4f4">
      <h2 style="color:#185fa5">How to use this coach</h2>
      <p><strong>Practice Mode:</strong> Question appears first. Think through your answer mentally, then reveal the strong answer and score yourself. <strong>Study Mode:</strong> Question and answer appear together for review. Use the Power Tips tab for Integration-specific coaching notes.</p>
    </div>
  `;
}

function renderTips() {
  return `
    <div class="stage-intro">
      <h2>Power Tips — M&A Integration Specific Coaching</h2>
      <p>These are the insider observations that will separate you from generic procurement candidates. Speak the language of integrations, dispositions, and cross-functional alignment.</p>
    </div>
    ${TIPS.map((t, i) => `
      <div class="card" style="min-height:auto;margin-bottom:12px;padding:1.25rem 1.5rem">
        <div style="display:flex;align-items:flex-start;gap:12px">
          <div style="min-width:28px;height:28px;border-radius:50%;background:#0a2d5e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:2px">${i+1}</div>
          <div>
            <div style="font-weight:600;font-size:15px;color:#0a2d5e;margin-bottom:6px">${t.title}</div>
            <div style="font-size:14px;line-height:1.7;color:#333">${t.body}</div>
          </div>
        </div>
      </div>
    `).join('')}
  `;
}

function renderDone() {
  const qs = getQs();
  const stageLabels = { hr: "HR Screen", hm: "Hiring Manager", tp: "Team Panel", vp: "VP Executive" };
  const nailed = Object.keys(scores).filter(k => k.startsWith(currentStage+'-') && scores[k] === 'easy').length;
  const working = Object.keys(scores).filter(k => k.startsWith(currentStage+'-') && scores[k] === 'medium').length;
  const hard = Object.keys(scores).filter(k => k.startsWith(currentStage+'-') && scores[k] === 'hard').length;
  
  return `
    <div class="done-screen">
      <div style="font-size:40px;margin-bottom:1rem">✓</div>
      <h3>${stageLabels[currentStage]} — Complete</h3>
      <p>You've worked through all ${qs.length} questions for this stage. Here's how you scored yourself.</p>
      <div class="done-stats">
        <div class="done-stat"><div class="n" style="color:#2e7d32">${nailed}</div><div class="l">Nailed it</div></div>
        <div class="done-stat"><div class="n" style="color:#ba7517">${working}</div><div class="l">Getting there</div></div>
        <div class="done-stat"><div class="n" style="color:#a32d2d">${hard}</div><div class="l">Need work</div></div>
      </div>
      ${hard > 0 ? `<p style="color:#a32d2d;font-size:13px">You flagged ${hard} question${hard>1?'s':''} as needing more work. Use Study Mode to review those answers until they feel natural.</p>` : ''}
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:1rem">
        <button class="nav-btn primary" onclick="restartStage()">Restart this stage</button>
        <button class="nav-btn" onclick="setStage(&apos;overview&apos;)">Back to overview</button>
      </div>
    </div>
  `;
}

function setMode(m) {
  mode = m;
  revealed = false;
  if (m === 'practice') { renderResumePanel([]); renderJdPanel([]); }
  renderMain();
}

function revealAnswer() {
  revealed = !revealed;
  var qs = getQs();
  var q = qs[currentQ];
  if (q) {
    renderResumePanel(revealed ? (q.resumeKeys || []) : []);
    renderJdPanel(revealed ? (q.jdKeys || []) : []);
  }
  renderMain();
}

function markScore(s) {
  scores[`${currentStage}-${currentQ}`] = s;
  renderMain();
}

function nextQ() {
  const qs = getQs();
  if (currentQ < qs.length - 1) {
    currentQ++;
    revealed = false;
    renderMain();
  } else {
    currentQ = qs.length;
    renderMain();
  }
  if (currentStage in stageProgress) {
    stageProgress[currentStage] = Math.max(stageProgress[currentStage], currentQ);
  }
}

function prevQ() {
  if (currentQ > 0) {
    currentQ--;
    revealed = false;
    renderMain();
  }
}

function restartStage() {
  currentQ = 0;
  revealed = false;
  renderMain();
}

function renderSearch() {
  const el = document.getElementById("mainContent");
  if (!el) return;
  const results = searchQuestions(searchQuery);
  const hasQuery = searchQuery.trim().length >= 2;

  var html = '<div class="stage-intro"><h2>Search &amp; Ask AI</h2><p>Search the full question bank by keyword. If your question is not covered, type it below — Claude will generate a tailored answer using your resume and the Integration knowledge base, then save it to your bank.</p></div>';

  html += '<div class="search-wrap">';
  html += '<span class="search-icon">&#128269;</span>';
  html += '<input class="search-input" type="text" id="searchField" placeholder="Search by keyword e.g. disposition, software, negotiation, STAR..." oninput="handleSearchInput(this.value)" />';
  if (searchQuery) html += '<button class="search-clear" onclick="clearSearch()">&#215;</button>';
  html += '</div>';

  if (hasQuery && results.length > 0) {
    html += renderSearchResults(results);
    html += '<div style="margin-top:1.5rem">' + renderAiBox() + '</div>';
  } else if (hasQuery && results.length === 0) {
    html += '<div class="no-results"><h3>No matching questions found</h3><p>No existing questions match that search. Use the Claude generator below to create and save a new answer.</p></div>';
    html += renderAiBox();
  } else {
    html += renderAiBox();
  }

  el.innerHTML = html;

  var sf = document.getElementById("searchField");
  if (sf) {
    sf.value = searchQuery;
    sf.focus();
    var len = sf.value.length;
    sf.setSelectionRange(len, len);
  }
}

function renderSearchResults(results) {
  var expanded = expandedSearchResult;
  var html = '<div class="search-results-label">' + results.length + ' result' + (results.length !== 1 ? 's' : '') + ' found</div>';
  results.forEach(function(r, i) {
    var isOpen = expanded === i;
    if (isOpen) {
      html += '<div class="search-expanded-card">';
      html += '<div class="se-header"><div>';
      html += '<div class="sr-stage">' + r.stageLabel + ' &middot; ' + r.category + (r.isCustom ? ' &middot; <span style="color:#0f6e56;font-weight:700">AI Generated</span>' : '') + '</div>';
      html += '<div style="font-size:16px;font-weight:500;color:#111;line-height:1.5">' + esc(r.q) + '</div>';
      html += '</div><button class="se-close" onclick="collapseResult()">&#215;</button></div>';
      html += '<div style="font-size:10.5px;font-weight:700;color:#2e7d32;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;margin-top:1rem;border-top:1px solid #f0ede8;padding-top:1rem">Strong answer</div>';
      html += '<div style="font-size:14px;line-height:1.75;color:#222">' + formatAnswer(r.a) + '</div>';
      html += '<div class="se-coaching"><strong style="color:#534ab7">Coaching note:</strong> ' + esc(r.coaching) + '</div>';
      html += '<div style="margin-top:1rem;display:flex;gap:8px">';
      html += '<button class="nav-btn" onclick="goToQuestion(\'' + r.stage + '\',' + r.idx + ')">Go to this question &rarr;</button>';
      html += '<button class="nav-btn" onclick="collapseResult()">Collapse</button></div>';
      html += '</div>';
    } else {
      var preview = r.a.replace(/\n/g,' ').substring(0, 130) + '...';
      html += '<div class="search-result-card" onclick="expandResult(' + i + ')">';
      html += '<div class="sr-stage">' + r.stageLabel + ' &middot; ' + r.category + (r.isCustom ? ' &middot; <span style="color:#0f6e56;font-weight:700">AI Generated</span>' : '') + '</div>';
      html += '<div class="sr-q">' + esc(r.q) + '</div>';
      html += '<div class="sr-preview">' + esc(preview) + '</div>';
      html += '<span class="sr-cat">Click to expand answer</span>';
      html += '</div>';
    }
  });
  return html;
}

function renderAiBox() {
  var hasKey = apiKey && apiKey.trim().startsWith('sk-');
  var html = '<div class="ai-generate-box">';
  html += '<h4>Ask Claude a new question</h4>';
  html += '<p>Type any interview question you want answered. Claude will respond using your resume, Sourcing Integration methodology, and relevant market context. Save the answer directly to your question bank.</p>';

  if (!hasKey) {
    html += '<div style="background:#fff8e8;border:1px solid #fac775;border-radius:8px;padding:0.75rem 1rem;font-size:13px;color:#633806;margin-bottom:1rem"><strong>API key required.</strong> Enter your Anthropic API key in the bar at the top of the page, then click Save key.</div>';
  }

  html += '<div style="margin-bottom:0.85rem"><label style="font-size:12px;font-weight:600;color:#555;display:block;margin-bottom:6px">Your question</label>';
  html += '<div id="aiQuestionDisplay" style="min-height:80px;padding:0.75rem;font-size:14px;border:1px solid #d0cdc8;border-radius:8px;background:#fff;color:#1a1a1a;line-height:1.6;cursor:text;white-space:pre-wrap" contenteditable="true" oninput="syncAiQ(this)">' + esc(aiDraftQuestion) + '</div></div>';

  html += '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:0.85rem">';
  html += '<div><label style="font-size:12px;font-weight:600;color:#555;display:block;margin-bottom:4px">Stage / Interviewer</label>';
  html += '<select id="aiStageSelect" style="padding:0.55rem 0.85rem;border:1px solid #d0cdc8;border-radius:8px;font-size:13px;color:#1a1a1a;background:#fff;outline:none">';

    html += '<div class="ai-q-label">Question</div>';

      html += '<div class="ai-a-label" style="margin-top:1rem;padding-top:1rem;border-top:1px solid #dce8f8">Strong answer</div>';

        html += '<div style="margin-top:1rem;background:#f9f6ff;border:0.5px solid #cdc8f5;border-radius:8px;padding:0.75rem 1rem;font-size:13px;color:#534ab7;line-height:1.6"><strong>Coaching note:</strong> ' + esc(aiResult.coaching) + '</div>';
      }
      html += '<div class="ai-save-row"><button class="ai-save-btn" onclick="saveAiAnswer()">Save to question bank</button><button class="ai-discard-btn" onclick="discardAiAnswer()">Discard</button></div>';
    } else {
      html += '<div style="color:#a32d2d;font-size:13px;margin-top:0.5rem">' + esc(aiResult.a) + '</div>';

    }
    html += '</div>';
  }

  html += '</div>';
  return html;
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function collapseResult() {

function goToQuestion(stage, idx) {

function getAllQuestions() {
  var all = [];
  var SLABELS = {hr:'HR Screen',hm:'Hiring Manager',tp:'Team Panel',vp:'VP Executive'};
  ['hr','hm','tp','vp'].forEach(function(stage) {
    var base = QUESTIONS[stage] || [];
    var custom = customQuestions[stage] || [];
    var combined = base.concat(custom);
    combined.forEach(function(q, idx) {
      all.push(Object.assign({}, q, { stage: stage, stageLabel: SLABELS[stage], idx: idx, isCustom: idx >= base.length }));
    });
  });
  return all;
}

function searchQuestions(query) {
  if (!query || query.trim().length < 2) return [];
  var q = query.toLowerCase();
  return getAllQuestions().filter(function(item) {
    return item.q.toLowerCase().includes(q) || item.a.toLowerCase().includes(q) || item.category.toLowerCase().includes(q) || item.stageLabel.toLowerCase().includes(q);
  });
}

async function generateAiAnswer() {
  var stageSelect = document.getElementById('aiStageSelect');
  var question = (aiDraftQuestion || '').trim();
  if (!question) { alert('Please type a question first.'); return; }
  if (!apiKey || !apiKey.trim().startsWith('sk-')) { alert('Please enter and save your Anthropic API key first.'); return; }

  var stage = stageSelect ? stageSelect.value : 'hm';
  aiSelectedStage = stage;
  var stageCtx = {
    hr: 'HR Screener / Talent Acquisition — assessing fit, project management, M&A readiness, logistics. Warm, narrative, human-sounding answers.',
    hm: 'Hiring Manager / Director — assessing technical integration depth, disposition strategy (consolidate/retain/exit), Lean/Six Sigma process improvement, IT licensing risks, compliance (SOC2/HIPAA), cross-functional alignment.',
    tp: 'Cross-functional Panel (HR, Finance, Legal, IT) — assessing executive presence, governance facilitation, handling competing priorities, managing TSAs, project communications.',
    vp: 'VP or Executive — assessing strategic maturity, enterprise thinking, viewing sourcing as a driver of business continuity, enterprise-wide project leadership (LPB level) and aligning with GEHC Precision Care M&A strategy.'
  };

  aiGenerating = true;
  aiResult = null;
  renderSearch();

  var systemPrompt = "You are an expert interview coach helping Tolulope Adebisi prepare for an LPB Sourcing Integration Project Lead role at GE Healthcare (focused on PMI/Post-Merger Integration, M&A, all supplier categories but heavy IT/Software, Lean/Six Sigma, and MedTech compliance).\n\nCANDIDATE BACKGROUND:\n" + RESUME_CONTEXT + "\n\nROLE CONTEXT:\n" + JD_CONTEXT + "\n\nINTERVIEWER CONTEXT: " + stageCtx[stage] + "\n\nGenerate a strong, highly conversational, confident, and human-sounding interview answer that:\n1. Sounds like Tolulope speaking naturally (use phrases like 'Honestly,' 'For example,' 'The way I approach this')\n2. Draws on Tolulope\'s actual experience (especially Plural Health for healthcare compliance, plus Maestrogrid/Rhea)\n3. References GE Healthcare/M&A context naturally (master supplier list/PMI workstream planning, disposition strategy/M&A synergy capture, TSAs, PHI/compliance, Lean/Six Sigma, merging vendor ecosystems)\n4. Is calibrated for the specific interviewer type above\n5. Uses STAR structure for behavioral questions but leads with insight\n\nAlso generate:\n- A 1-2 sentence coaching note\n- resumeKeys: which resume sections this answer draws on. Choose ONLY from: [maestrogrid, rhea, plural, fitc, krystal, skills]\n- jdKeys: which JD sections this answer targets. Choose ONLY from: [integration_scope, disposition_strategy, governance, execution, risk_mgmt, project_mgmt]\n\nRespond ONLY with valid JSON — no markdown, no preamble:\n{\"answer\": \"answer text (use normal newlines for paragraphs)\", \"coaching\": \"coaching note\", \"resumeKeys\": [\"plural\"], \"jdKeys\": [\"risk_mgmt\"]}"

  try {
    var resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey.trim(),
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1200,
        system: systemPrompt,
        messages: [{ role: 'user', content: 'Interview question to answer: "' + question + '"' }]
      })
    });

    if (!resp.ok) {
      var errData = await resp.json().catch(function() { return {}; });
      throw new Error(errData.error ? errData.error.message : 'API error ' + resp.status);
    }

    var data = await resp.json();
    var raw = (data.content && data.content[0] && data.content[0].text) ? data.content[0].text : '';
    var parsed;
    try {
      var match = raw.match(/\{[\s\S]*\}/);
      parsed = JSON.parse(match ? match[0] : raw);
    } catch(e) {
      parsed = { answer: raw, coaching: 'Review and adapt this answer to your own voice.' };
    }
    aiResult = { q: question, a: parsed.answer || raw, coaching: parsed.coaching || '', stage: stage, resumeKeys: parsed.resumeKeys || [], jdKeys: parsed.jdKeys || [] };
  } catch(e) {
    aiResult = { q: question, a: 'Error: ' + e.message + '. Check your API key and try again.', coaching: '', stage: stage, isError: true, resumeKeys: [] };
  }

  aiGenerating = false;
  if (aiResult && !aiResult.isError) {
    renderResumePanel(aiResult.resumeKeys || []);
    renderJdPanel(aiResult.jdKeys || []);
  }
  renderSearch();
}

function saveAiAnswer() {
  if (!aiResult || aiResult.isError) return;
  var entry = {
    category: 'AI Generated',
    q: aiResult.q,
    a: aiResult.a,
    coaching: aiResult.coaching || 'AI-generated answer — adapt to your own voice before using.',
    resumeKeys: aiResult.resumeKeys || [],
    jdKeys: aiResult.jdKeys || []
  };
  if (!customQuestions[aiResult.stage]) customQuestions[aiResult.stage] = [];
  customQuestions[aiResult.stage].push(entry);
  searchQuery = aiResult.q.substring(0, 50);
  aiResult = null;
  aiDraftQuestion = '';
  renderResumePanel([]);
  renderJdPanel([]);
  renderSearch();
}

(function() {
  var handle = document.getElementById('jdResizeHandle');
  var panel  = document.getElementById('jdPanel');
  var wrap   = document.getElementById('pageWrap');
  if (!handle || !panel || !wrap) return;
  var dragging = false, startX = 0, startW = 0;

    if (!jdPanelVisible) return;
    dragging = true; startX = e.clientX; startW = panel.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var delta = startX - e.clientX;
    var newW = Math.min(Math.max(startW + delta, 180), wrap.offsetWidth * 0.6);
    panel.style.width = newW + 'px';
    panel.style.minWidth = newW + 'px';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();

})();
