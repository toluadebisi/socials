// ─── LOCALSTORAGE PERSISTENCE ───────────────────────────
function saveState(){
  try{
    localStorage.setItem('ic_scores',JSON.stringify(scores));
    localStorage.setItem('ic_customQs',JSON.stringify(customQs));
    localStorage.setItem('ic_checklist',JSON.stringify(checklist));
  }catch(e){}
}
function loadState(){
  try{
    const s=localStorage.getItem('ic_scores');if(s)scores=JSON.parse(s);
    const c=localStorage.getItem('ic_customQs');if(c)customQs=JSON.parse(c);
    const ch=localStorage.getItem('ic_checklist');if(ch)checklist=JSON.parse(ch);
  }catch(e){}
}
loadState();

function getQs(){
  const base=QS[stage]||[];
  const custom=customQs[stage]||[];
  return [...base,...custom];
}

// ─── RENDER NAV ─────────────────────────────────────────
function renderNav(){
  document.getElementById('navEl').innerHTML=STAGES.map(s=>{
    const qs=QS[s.id];
    const done=qs&&Object.keys(scores).filter(k=>k.startsWith(s.id+'-')).length>=qs.length&&qs.length>0;
    return `<button class="nav-btn${stage===s.id?' active':''}" onclick="goStage('${s.id}')">${s.label}${s.badge?`<span class="nav-badge ${s.bc}">${s.badge}</span>`:''}${done?`<span class="check-badge">✓</span>`:''}</button>`;
  }).join('');
}

function goStage(id){stage=id;qIdx=0;revealed=false;renderNav();renderMain();}

// ─── MAIN RENDER ────────────────────────────────────────
function renderMain(){
  const el=document.getElementById('mainContent');
  if(!el)return;
  if(stage==='overview'){el.innerHTML=renderOverview();renderResume([]);renderJd([]);return;}
  if(stage==='tips'){el.innerHTML=renderTips();renderResume([]);renderJd([]);return;}
  if(stage==='grader'){el.innerHTML=renderGrader();renderResume([]);renderJd([]);return;}
  if(stage==='gameday'){el.innerHTML=renderGameDay();renderResume([]);renderJd([]);return;}
  if(stage==='search'){renderSearch();renderResume([]);renderJd([]);return;}
  if(stage==='gaps'){renderGaps();return;}

  const qs=getQs();
  if(!qs.length){el.innerHTML='<p style="color:var(--ink3);font-size:13px">No questions yet.</p>';return;}
  if(qIdx>=qs.length){el.innerHTML=renderDone();renderResume([]);renderJd([]);return;}

  const q=qs[qIdx];
  const pct=Math.round((qIdx/qs.length)*100);
  const scoreKey=stage+'-'+qIdx;
  const picked=scores[scoreKey];
  const showKeys=mode==='study'||revealed;

  renderResume(showKeys?(q.resumeKeys||[]):[]);
  renderJd(showKeys?(q.jdKeys||[]):[]);

  const revBtn=mode==='practice'?`<button class="reveal-btn" onclick="toggleReveal()">${revealed?'Hide answer':'Reveal answer'}</button>`:'';
  const ansVis=(mode==='study'||revealed)?' show':'';
  const scoreHtml=mode==='practice'?`<div class="score-row"><span class="score-label">How did you do?</span><button class="score-btn easy${picked==='easy'?' picked':''}" onclick="setScore('easy')">Nailed it</button><button class="score-btn med${picked==='med'?' picked':''}" onclick="setScore('med')">Getting there</button><button class="score-btn hard${picked==='hard'?' picked':''}" onclick="setScore('hard')">Need work</button></div>`:'';

  el.innerHTML=`
    <div class="stage-intro">${getIntro(stage)}</div>
    <div class="mode-row">
      <button class="mode-opt${mode==='practice'?' active':''}" onclick="setMode('practice')">Practice Mode</button>
      <button class="mode-opt${mode==='study'?' active':''}" onclick="setMode('study')">Study Mode</button>
    </div>
    <div class="prog-row">
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <span class="prog-label">${qIdx+1} / ${qs.length}</span>
    </div>
    <div class="q-card">
      <div class="q-card-top">
        <div class="q-num">Question ${qIdx+1}</div>
        <div class="q-cat">${q.category}</div>
      </div>

      ${revBtn}
      <div class="answer-block${ansVis}">
        <div class="answer-label">Strong answer</div>
        <div class="answer-text">${q.a||''}</div>
        <div class="coach-note"><strong>Coaching note:</strong> ${esc(q.coaching||'')}</div>
        ${scoreHtml}
      </div>
    </div>
    <div class="nav-controls">
      <button class="ctrl-btn" onclick="prevQ()" ${qIdx===0?'disabled':''}>&larr; Previous</button>
      <button class="ctrl-btn primary" onclick="nextQ()">${qIdx<qs.length-1?'Next question &rarr;':'Finish stage &rarr;'}</button>
    </div>`;
}

function getIntro(s){

    hr:{title:"Stage 1 — HR Screening Interview",desc:"30–45 minute call with Talent Acquisition. They're assessing fit, M&A readiness, project leadership, and whether to advance you. Warm, narrative, human-sounding answers. No bullet points out loud.",chips:["Keep answers to ~90 seconds","Bridge every answer to M&A skills","Lead with the story, not the resume"]},
    hm:{title:"Stage 2 — Hiring Manager Deep Dive",desc:"Your most important interview. They're assessing integration methodology, disposition strategy depth, Lean/Six Sigma process thinking, IT licensing sophistication, and healthcare compliance awareness.",chips:["Use STAR but lead with insight","Name the specific risks — Change of Control, true-ups, SOC 2","Reference 'master supplier list' and 'disposition roadmap' naturally"]},
    tp:{title:"Stage 3 — Cross-functional Panel",desc:"You may present to Legal, Finance, IT, and Sourcing simultaneously. They're assessing executive presence, governance facilitation, how you handle competing priorities, and whether you can hold the room.",chips:["Address each function's specific priorities","Deliver the 90-day plan confidently","Acknowledge what you don't know — then show you've thought it through"]},
    vp:{title:"Stage 4 — VP / Executive Interview",desc:"30–45 minutes with a VP or CPO. They're assessing strategic maturity, enterprise thinking, whether you view sourcing as a business continuity function, and whether you understand GE Healthcare's Precision Care M&A strategy.",chips:["Elevate sourcing to a strategic continuity role","Align explicitly to the Precision Care AI acquisition thesis","Think out loud on complex questions — show the reasoning process"]},
    gaps:{title:"Hard Questions & Gap Bridging",desc:"The questions most candidates dread — the M&A experience gap, weakness questions, salary, failure stories. These are opportunities to demonstrate honesty, self-awareness, and genuine preparation.",chips:["Name the gap first — then bridge it with confidence","Never fake credentials","Show what you've changed based on a real mistake"]}
  };
  const i=d[s];
  if(!i)return '';
  return `<h2>${i.title}</h2><p>${i.desc}</p><div class="stage-chips">${i.chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div>`;

    <div class="q-card" style="border-color:#f0c0c0">

function renderDone(){
  const qs=getQs();
  const labs={hr:'HR Screen',hm:'Hiring Manager',tp:'Team Panel',vp:'VP Executive',gaps:'Hard Questions'};
  const nailed=Object.keys(scores).filter(k=>k.startsWith(stage+'-')&&scores[k]==='easy').length;
  const working=Object.keys(scores).filter(k=>k.startsWith(stage+'-')&&scores[k]==='med').length;
  const hard=Object.keys(scores).filter(k=>k.startsWith(stage+'-')&&scores[k]==='hard').length;
  return `
    <div class="done-screen">
      <div style="font-size:44px;margin-bottom:1rem">✓</div>
      <h3>${labs[stage]||stage} — Complete</h3>
      <p>You've worked through all ${qs.length} questions for this stage. Here's how you scored yourself.</p>
      <div class="done-stats">
        <div class="done-stat"><div class="n" style="color:var(--success)">${nailed}</div><div class="l">Nailed it</div></div>
        <div class="done-stat"><div class="n" style="color:var(--warn)">${working}</div><div class="l">Getting there</div></div>

      </div>

function renderSearch(){
  const el=document.getElementById('mainContent');if(!el)return;
  const results=doSearch(searchQ);
  const hasQ=searchQ.trim().length>=2;
  let html=`
    <div class="stage-intro">
      <h2>Search &amp; Ask AI</h2>
      <p>Search the full question bank by keyword or topic. If your specific question isn't covered, type it below — Claude will generate a fully personalized answer using your resume and integration context, then save it to your bank.</p>
    </div>
    <div class="search-wrap">
      <span class="search-icon">&#128269;</span>
      <input class="search-input" type="text" id="searchField" placeholder="Search: disposition, BATNA, TSA, software, negotiation..." oninput="handleSearch(this.value)"/>
      ${searchQ?'<button class="search-clear" onclick="clearSearch()">&#215;</button>':''}
    </div>`;
  if(hasQ&&results.length>0){html+=renderResults(results)+'<div style="margin-top:1.5rem">'+renderAiBox()+'</div>';}
  else if(hasQ&&results.length===0){html+='<div class="no-results"><h3>No matching questions found</h3><p>Use the AI generator below to create and save a custom answer.</p></div>'+renderAiBox();}
  else{html+=renderAiBox();}
  el.innerHTML=html;
  const sf=document.getElementById('searchField');if(sf){sf.value=searchQ;sf.focus();sf.setSelectionRange(sf.value.length,sf.value.length);}
}

function renderResults(results){
  let html=`<div class="sr-label">${results.length} result${results.length!==1?'s':''} found</div>`;
  results.forEach((r,i)=>{
    const isOpen=expandedSR===i;

function getAllQs(){

  ['hr','hm','tp','vp','gaps'].forEach(s=>{

function makeResizable(handleId,panelId,direction){
  const h=document.getElementById(handleId),p=document.getElementById(panelId),w=document.getElementById('layout');
  if(!h||!p||!w)return;
  let drag=false,sx=0,sw=0;
  h.addEventListener('mousedown',e=>{drag=true;sx=e.clientX;sw=p.offsetWidth;h.classList.add('drag');document.body.style.cursor='col-resize';document.body.style.userSelect='none';e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(!drag)return;const delta=direction==='right'?sx-e.clientX:e.clientX-sx;const nw=Math.min(Math.max(sw+delta,160),w.offsetWidth*0.5);p.style.width=nw+'px';p.style.minWidth=nw+'px';});
  document.addEventListener('mouseup',()=>{if(!drag)return;drag=false;h.classList.remove('drag');document.body.style.cursor='';document.body.style.userSelect='';});
}

}`;

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey.trim(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1400,system,messages:[{role:'user',content:`Candidate's answer to grade:\n\n"${answer}"`}]})});
    if(!resp.ok){const e=await resp.json().catch(()=>({}));throw new Error(e.error?e.error.message:'API error '+resp.status);}
    const data=await resp.json();
    const raw=(data.content&&data.content[0]&&data.content[0].text)||'';
    let parsed;
    try{const m=raw.match(/\{[\s\S]*\}/);parsed=JSON.parse(m?m[0]:raw);}catch(e){throw new Error('Could not parse grader response.');}
    graderResult=parsed;
  }catch(e){
    graderResult={isError:true,error:'Grading failed: '+e.message+'. Check your API key and try again.'};
  }
  graderLoading=false;renderMain();
}

// Separate voice instance for grader textarea
let graderVoiceActive=false,graderSR=null,graderRecInterval=null,graderRecSecs=0;
function toggleGraderVoice(){graderVoiceActive?stopGraderSpeech():startGraderSpeech();}
function startGraderSpeech(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){setGraderVoiceError('Not supported. Use Chrome or Edge.');return;}
  const btn=document.getElementById('graderVoiceBtn');
  const label=document.getElementById('graderVoiceLabel');
  const timer=document.getElementById('graderVoiceTimer');
  const status=document.getElementById('graderVoiceStatus');
  graderSR=new SpeechRecognition();
  graderSR.continuous=true;graderSR.interimResults=true;graderSR.lang='en-US';
  let final='';
  graderSR.onstart=()=>{
    graderVoiceActive=true;graderRecSecs=0;
    if(btn)btn.className='voice-btn recording';if(label)label.textContent='Stop recording';
    if(timer)timer.className='voice-timer show';if(status)status.textContent='Listening…';
    graderRecInterval=setInterval(()=>{graderRecSecs++;const m=Math.floor(graderRecSecs/60),s=graderRecSecs%60;if(timer)timer.textContent=m+':'+(s<10?'0':'')+s;if(graderRecSecs>=180)stopGraderSpeech();},1000);
  };
  graderSR.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t+' ';else interim+=t;}
    const ta=document.getElementById('graderTextarea');
    if(ta){const v=(final+interim).trim();ta.value=v;graderAnswer=v;}
  };
  graderSR.onerror=e=>{stopGraderSpeech();setGraderVoiceError('Mic error: '+e.error);};
  graderSR.onend=()=>{if(graderVoiceActive){try{graderSR.start();}catch(e){stopGraderSpeech();}}};
  try{graderSR.start();}catch(e){setGraderVoiceError('Could not start mic: '+e.message);}
}
function stopGraderSpeech(){
  graderVoiceActive=false;clearInterval(graderRecInterval);
  if(graderSR){try{graderSR.stop();}catch(e){}}graderSR=null;
  const btn=document.getElementById('graderVoiceBtn');const label=document.getElementById('graderVoiceLabel');
  const timer=document.getElementById('graderVoiceTimer');const status=document.getElementById('graderVoiceStatus');
  if(btn)btn.className='voice-btn idle';if(label)label.textContent='Record answer';
  if(timer)timer.className='voice-timer';if(status)status.textContent='✓ Answer captured — click Grade my answer';
}
function setGraderVoiceError(msg){const s=document.getElementById('graderVoiceStatus');if(s){s.className='voice-error';s.textContent=msg;setTimeout(()=>{if(s){s.className='voice-status';s.textContent='Speak your answer out loud — it appears in the box below';}},4000);}}

// ─── VOICE RECORDING (Web Speech API — browser-native STT, no extra API needed) ─────
let recInterval=null,recSeconds=0,voiceActive=false,speechRecognition=null;

function toggleVoice(){
  if(voiceActive){stopSpeech();}else{startSpeech();}
}

function startSpeech(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    setVoiceError('Speech recognition not supported. Try Chrome or Edge browser.');return;
  }
  const btn=document.getElementById('voiceBtn');
  const label=document.getElementById('voiceBtnLabel');
  const timer=document.getElementById('voiceTimer');
  const status=document.getElementById('voiceStatus');

  speechRecognition=new SpeechRecognition();
  speechRecognition.continuous=true;
  speechRecognition.interimResults=true;
  speechRecognition.lang='en-US';

  let finalTranscript='';
  let interim='';

  speechRecognition.onstart=()=>{
    voiceActive=true;recSeconds=0;
    btn.className='voice-btn recording';
    label.textContent='Stop recording';
    timer.className='voice-timer show';
    status.textContent='Listening… speak your question clearly';
    recInterval=setInterval(()=>{
      recSeconds++;
      const m=Math.floor(recSeconds/60),s=recSeconds%60;
      if(timer)timer.textContent=m+':'+(s<10?'0':'')+s;
      if(recSeconds>=120)stopSpeech();
    },1000);
  };

  speechRecognition.onresult=e=>{
    interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal){finalTranscript+=t+' ';}
      else{interim+=t;}
    }
    // Live update the text area
    const area=document.getElementById('aiQArea');
    if(area){
      const display=(finalTranscript+interim).trim();
      area.innerText=display;
      aiDraft=display;
    }
    if(status)status.textContent='Listening… (speak or click Stop when done)';
  };

  speechRecognition.onerror=e=>{
    stopSpeech();
    const msgs={
      'not-allowed':'Microphone access denied. Allow mic access in browser settings.',
      'no-speech':'No speech detected. Try again.',
      'network':'Network error during recognition.',
      'audio-capture':'No microphone found.'
    };
    setVoiceError(msgs[e.error]||'Speech recognition error: '+e.error);
  };

  speechRecognition.onend=()=>{
    // Auto-restart if still supposed to be active (Chrome cuts off after ~1min)
    if(voiceActive){
      try{speechRecognition.start();}catch(e){stopSpeech();}
    }
  };

  try{speechRecognition.start();}catch(e){setVoiceError('Could not start microphone: '+e.message);}
}

function stopSpeech(){
  voiceActive=false;
  clearInterval(recInterval);
  if(speechRecognition){try{speechRecognition.stop();}catch(e){}}
  speechRecognition=null;
  resetVoiceBtn();
  const area=document.getElementById('aiQArea');
  if(area&&area.innerText.trim()){
    const status=document.getElementById('voiceStatus');
    if(status)status.textContent='✓ Question captured — review above and click Generate';
  }
}

function resetVoiceBtn(){
  const btn=document.getElementById('voiceBtn');
  const label=document.getElementById('voiceBtnLabel');
  const timer=document.getElementById('voiceTimer');
  if(btn)btn.className='voice-btn idle';
  if(label)label.textContent='Record question';
  if(timer)timer.className='voice-timer';
}

function setVoiceError(msg){
  const status=document.getElementById('voiceStatus');
  if(status){status.className='voice-error';status.textContent=msg;setTimeout(()=>{if(status){status.className='voice-status';status.textContent='Speak your interview question — it will appear in the box below';}},4000);}
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
