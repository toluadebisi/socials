    {

      a: `Sure — happy to give you the overview and then we can go wherever is most useful.

I'm a strategic sourcing professional with just over ten years of experience. My focus has consistently been external labour — contingent workforce, technology staff augmentation, SOW professional services — and I've built that expertise across a range of industries and environments.

My career started in IT and ERP sourcing in Nigeria, where I built foundational skills in running competitive events, negotiating contracts, and managing supplier relationships across complex technology portfolios. I moved into progressively senior roles and relocated to Canada in 2023. Since then, I've been based here in Toronto at Maestrogrid, where I hold a Senior Procurement Manager role. There I built the enterprise category management framework for external labour and IT software from scratch — that work reduced our time-to-award by 20% and significantly improved our supplier mix and governance.

      coaching: "The HR screener is assessing: Does this person have the right background? Are they articulate and professional? Do they seem genuinely interested? They're NOT testing deep sourcing knowledge yet — that's the hiring manager's job. This version is warmer and more narrative, covers your career arc clearly including your Canada context, and ends with genuine enthusiasm. Keep it under 90 seconds when spoken. Sound like a person, not a press release."

I then designed the RFP in a way that gave the incumbent a genuine opportunity to win on merit — and ultimately, elements of the existing panel were preserved while the supplier mix was rebalanced and rates were reset to market.

For existing contracts, I work with Legal to assess whether the updated requirements can be addressed through existing amendment provisions or require a formal contract variation. For suppliers whose contracts are coming up for renewal, I incorporate the updated requirements into the new MSA terms as a matter of course.

For the supplier panel broadly, I issue a formal notification outlining the updated requirements, the compliance timeline, and the confirmation they need to provide. For high-risk suppliers, I schedule a specific meeting to review their updated compliance posture rather than relying on self-certification.

I also build the updated requirements into the standard sourcing collateral — RFP questionnaire, contract templates, SRM scorecard — so that future sourcing events are already aligned with current guidance from day one.

At Plural Health, navigating regulatory updates in a healthcare environment built the discipline of treating compliance as continuous rather than episodic.`,
      coaching: "Show proactive engagement with the regulation itself, not just waiting for Legal. Name the five-step response: read it, identify affected provisions, assess existing contracts, notify suppliers, update collateral."
    },
    {
      category: "Difficult Scenario",
      resumeKeys: ["plural","maestrogrid"],
      q: "Midway through a $42M sourcing event, your preferred supplier fails to complete their OSFI third-party risk assessment on time. The contract start date is 6 weeks away. What do you do?",
      a: `First, I find out why. Is this a capacity issue, a documentation gap, or a substantive compliance concern that the assessment process has surfaced? The answer determines everything.

If it's a capacity issue — the supplier has the right controls in place but didn't resource the assessment properly — I engage BMO's Third-Party Risk team directly to work with the supplier's risk team on an accelerated timeline. I set a hard new deadline with written confirmation, and I communicate the risk and revised timeline to the CPO and Legal immediately. No surprises to leadership.

If the assessment has surfaced a substantive compliance gap — a data residency issue, a sub-contractor oversight problem, a cybersecurity control that isn't in place — that's a different situation. That becomes a conditions precedent conversation: the award is conditional on successful OSFI assessment, and if they can't meet the standard, we have a problem with the award, not just the timeline.

In either case, I'd be evaluating whether the second-ranked supplier could be activated on an interim basis, or whether the current panel could be extended while we resolve the issue.

I'd also do a lessons-learned on why this risk wasn't caught earlier. The OSFI assessment should be a qualification threshold in the RFP with a clear commitment timeline established at the Preliminary Award Notification stage — not something being chased six weeks before go-live.`,
      coaching: "Show triage speed, immediate upward communication, and the mitigation plan. The lessons-learned component signals governance maturity — you fix the process, not just the incident."
    },
    {
      category: "Communication",
      resumeKeys: ["maestrogrid","skills"],
      q: "How do you communicate sourcing outcomes and category performance to senior leaders who don't have a deep procurement background?",
      a: `Senior leaders need two things from sourcing communication: clarity on what we did and what it delivers, and confidence that the risks are understood and managed.

My standard approach is a one-page category health summary covering four things: the commercial outcome in plain language and dollars, the supplier panel structure and what changed, the key risks on the radar with what's being done about them, and the forward look for the next quarter.

What I deliberately avoid is procurement jargon. 'We ran a competitive process with eight suppliers, selected two, and the new rates will save the bank $3.6M over three years' is more powerful than 'the competitive event resulted in a dual-panel award generating $3.6M in TCV savings against the FY2025 baseline.'

I also tailor the communication to the audience's specific concern. The CFO wants to know the savings number is Finance-approved and the methodology is sound. The CTO wants to know the new suppliers can fill roles at the required quality and speed. The CRO wants to know OSFI obligations are met and concentration risk is managed. Same outcome — three different conversations.

At Maestrogrid, I started presenting to the CFO quarterly with a one-page category scorecard. It became a standing agenda item — which is the signal that senior leadership sees sourcing as a value-generating function, not just a process layer.`,
      coaching: "Test of executive communication maturity. Show you can translate technical procurement work into language that resonates with C-suite audiences. The tailored-by-audience insight is particularly strong — it shows communication is about the receiver, not the sender."
    },
    {
      category: "Cultural Fit",
      resumeKeys: ["maestrogrid","plural"],
      q: "How would you describe your leadership style, and how do you create an environment where your team does their best work?",
      a: `My leadership style is what I'd describe as high-expectation, high-support. I set a clear bar for the quality of analytical and commercial work, and I hold people to it — but I also invest heavily in giving them the context, the coaching, and the room to develop so they can actually meet that bar.

The environment where sourcing professionals do their best work, in my experience, is one where they understand why the decisions they're making matter — not just what the process is. When a junior analyst understands why we build four award scenarios instead of just ranking suppliers by price, they engage differently with the analytical work. They're thinking, not just executing.

I also try to create a culture where surfacing problems early is rewarded, not penalised. In sourcing, problems that get escalated early are manageable. Problems that get disclosed late become crises. I'm explicit with my team that I'd rather know about a supplier risk issue at week three than week twelve — and I demonstrate that by responding constructively when problems are surfaced early.

I believe in giving people stretch assignments before they feel fully ready. At Maestrogrid, one of the most rewarding things I did was give a less experienced analyst primary responsibility for the bid sheet design on a significant RFP — with coaching from me throughout. The quality of the work was excellent, and it accelerated their development significantly.

Finally, I actively create space for challenge and disagreement in my team. I'd rather reach a better conclusion through debate than a faster conclusion through consensus.`,
      coaching: "VP-level leaders want to know you'll develop the team and create a culture that performs sustainably. High-expectation, high-support is a memorable and credible leadership framing. The escalation culture insight is particularly strong — it signals leadership maturity."
    },
    {
      category: "Closing",
      resumeKeys: ["skills"],
      q: "What questions do you have for us at this level?",
      a: `I have a few, and I want to be deliberate about which ones I ask here because I know your time is limited.

First: what is your view of where the external labour category sits in BMO's broader talent and workforce strategy over the next three years? I want to understand whether sourcing is expected to be a driver of that strategy or an executor of decisions made elsewhere — because that shapes how I'd approach the role from day one.

Second: where is the procurement function's relationship with Technology and HR leadership today? Is sourcing on the invite list for workforce planning conversations before decisions are made, or is the function primarily called in after requisitions are raised?

And third: what would success look like for this role at the 18-month mark, beyond the obvious metrics of savings delivered and contracts executed? What would you want to be able to say about the function — and the person in this role — at that point?

Those are the questions that matter most to me at this stage. I'm less interested in logistics and more interested in your perspective on where this function is going and what you need from the person who leads it.`,
      coaching: "VP-level closing questions should be strategic and peer-positioned. You're asking about their vision, the function's standing, and what success means to them. End by naming what you're interested in: their perspective on the function's trajectory."
    }
  ]
};

const TIPS = [
  { title: "Know the 7-step framework cold", body: "BMO uses a structured 7-step sourcing process. Reference it naturally — Category Assessment, Strategy Development, Collateral Development, RFP Management, RFP Analysis, Negotiations, Award & Implementation. When you do, you signal that you're already operating in their language." },
  { title: "Name specific KPIs from the scorecard", body: "Fill rate ≥85% (Tier 1, 30-day), time-to-fill ≤25 days, rate card compliance (zero off-card exceptions), cybersecurity fill rate ≥80%. These are the metrics in BMO's own supplier scorecard. Referencing them shows you understand what operational governance looks like." },
  { title: "Lead with spend data discipline", body: "BMO's Category Strategy Brief opens with spend validation. Always anchor your experience stories in spend data — 'I pulled AP, VMS, and HR data...' signals that you understand the foundational analytical work." },
  { title: "Reference the dual-supplier panel model", body: "BMO's chosen sourcing model for tech staff aug is a dual-panel — NorthStar as primary, CyberEdge as cybersecurity specialist. When discussing sourcing model design, mention dual-panel as your preferred approach for complex categories and explain why (concentration risk, leverage vs. continuity)." },
  { title: "Show OSFI fluency naturally", body: "Don't just say 'OSFI compliance' — explain what it means. Third-party risk assessment, data residency requirements, audit rights, Schedule D in the MSA. When OSFI comes up, show you understand why it matters and how you embed it into sourcing, not just that you know the acronym." },
  { title: "Anchor savings in methodology", body: "Always present savings as: baseline × volume delta = savings, agreed with Finance. Cost avoidance and demand management are reported separately. This is the methodology BMO uses ($3.6M hard savings, $810K cost avoidance, $1.4M demand management). Match this framework in your answers." },
  { title: "Bring energy to the near-miss stories", body: "One of BMO's most notable RFP moments was a supplier who bid daily rates on an hourly RFP — 6.5x distortion. Referencing the importance of bid normalization in your answers (without referencing BMO specifically) shows analytical depth that most candidates won't have." },
  { title: "Prepare a strong BATNA story", body: "BMO's guide explicitly covers BATNA as a negotiation foundation. Have a specific story ready: 'My BATNA was supplier B at a 4% higher rate — knowing that gave me a clear walk-away position in the room with supplier A.'" },
  { title: "Demonstrate stakeholder management with Finance", body: "In BMO's process, Finance sign-off is a formal gate at multiple steps. Show you understand this by always referencing that you align savings methodology with Finance BEFORE presenting to leadership. This is organizational intelligence." },
  { title: "End every answer with a forward lean", body: "Strong senior candidates don't just answer the question — they connect it to what they'd do in THIS role. 'That's exactly the approach I'd apply here...' or 'At BMO, with a category this size, I'd...' It signals you're already thinking as an insider." }
];

let currentStage = "overview";
let currentQ = 0;
let mode = "practice";
let revealed = false;
let scores = {};
let stageProgress = { hr: 0, hm: 0, tp: 0, vp: 0 };
let searchQuery = '';
let expandedSearchResult = null;
let aiResult = null;
let aiGenerating = false;
let aiDraftQuestion = '';
let aiSelectedStage = 'hm';
let apiKey = '';
let keyVisible = false;
let customQuestions = { hr: [], hm: [], tp: [], vp: [] };

function getQs() { return QUESTIONS[currentStage] || []; }

function renderNav() {
  const nav = document.getElementById("navTabs");
  if (!nav) return;
  nav.innerHTML = STAGES.map(s => {
    const qs = QUESTIONS[s.id];
    const done = qs && qs.length > 0 && stageProgress[s.id] >= qs.length;
    return '<button class="tab-btn ' + (currentStage === s.id ? 'active' : '') + '" onclick="setStage(\'' + s.id + '\')">' +
      s.label + (s.badge ? '<span class="stage-badge ' + s.badgeClass + '">' + s.badge + '</span>' : '') +
      (done ? '<span class="completed-check">&#10003;</span>' : '') +
      '</button>';
  }).join('');
}

function setStage(id) {
  currentStage = id;
  currentQ = 0;
  revealed = false;
  renderNav();
  renderMain();
}

function renderMain() {
  const el = document.getElementById("mainContent");
  if (currentStage === "overview") { el.innerHTML = renderOverview(); return; }
  if (currentStage === "tips") { el.innerHTML = renderTips(); return; }
  if (currentStage === "search") { renderSearch(); return; }
  const qs = getQs();
  if (!qs.length) { el.innerHTML = '<p>No questions.</p>'; return; }
  if (currentQ >= qs.length) { el.innerHTML = renderDone(); return; }
  
  const q = qs[currentQ];
  const pct = Math.round((currentQ / qs.length) * 100);
  const scoreKey = `${currentStage}-${currentQ}`;
  const picked = scores[scoreKey];

  el.innerHTML = `
    <div class="stage-intro">${getStageIntro(currentStage)}</div>
    <div class="mode-toggle">
      <button class="mode-btn ${mode === 'practice' ? 'active' : ''}" onclick="setMode('practice')">Practice Mode</button>
      <button class="mode-btn ${mode === 'study' ? 'active' : ''}" onclick="setMode('study')">Study Mode</button>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <span class="progress-label">${currentQ + 1} / ${qs.length}</span>
    </div>
    <div class="card">
      <div class="card-header">
        <div>
          <div class="q-number">Question ${currentQ + 1}</div>
        </div>
        <div class="q-category">${q.category}</div>
      </div>
      <div class="question-text">${q.q}</div>
      ${mode === 'practice' ? `
        <button class="reveal-btn" id="revealBtn" onclick="revealAnswer()">${revealed ? 'Hide answer' : 'Reveal answer'}</button>
      ` : ''}
      <div class="answer-block ${(mode === 'study' || revealed) ? 'visible' : ''}" id="answerBlock">
        <div class="answer-label">Strong answer</div>
        <div class="answer-text">${formatAnswer(q.a)}</div>
        <div class="coaching-note"><span>Coaching note:</span> ${q.coaching}</div>
        ${mode === 'practice' ? `
        <div class="score-row">
          <span style="font-size:12px;color:#888;align-self:center;">How did you do?</span>
          <button class="score-btn easy ${picked === 'easy' ? 'picked' : ''}" onclick="markScore('easy')">Nailed it</button>
          <button class="score-btn medium ${picked === 'medium' ? 'picked' : ''}" onclick="markScore('medium')">Getting there</button>
          <button class="score-btn hard ${picked === 'hard' ? 'picked' : ''}" onclick="markScore('hard')">Need more work</button>
        </div>` : ''}
      </div>
    </div>
    <div class="nav-controls">
      <button class="nav-btn" onclick="prevQ()" ${currentQ === 0 ? 'disabled' : ''}>← Previous</button>
      <button class="nav-btn primary" onclick="nextQ()">${currentQ < qs.length - 1 ? 'Next question →' : 'Finish stage →'}</button>
    </div>
  `;
}

function formatAnswer(text) {
  return text.split('\n\n').map(p => `<p style="margin-bottom:0.85rem">${p.trim()}</p>`).join('');
}

function getStageIntro(stage) {
  const intros = {
    hr: {
      title: "Stage 1 — HR Screening Interview",
      desc: "This is typically a 30-45 minute call with a Talent Acquisition partner. They're assessing fit, compensation alignment, logistics, and whether to move you forward. Be confident, specific, and human. This is not a technical stage — it's a credibility and motivation screen.",
      tips: ["Keep answers concise — 90 seconds max", "Be direct about compensation", "Show genuine enthusiasm for BMO specifically", "Confirm Toronto logistics proactively"]
    },
    hm: {
      title: "Stage 2 — Hiring Manager Interview",
      desc: "This is your most important interview — likely 60-90 minutes with the Director or VP Procurement. They're assessing your technical depth, sourcing judgment, stakeholder skills, and whether you can operate at BMO's level. Come with specific examples and quantified outcomes.",
      tips: ["Use STAR structure but lead with insight, not just sequence", "Reference the 7-step framework naturally", "Show spend data discipline in every answer", "Demonstrate you've navigated stakeholder resistance"]
    },
    tp: {
      title: "Stage 3 — Team / Panel Presentation",
      desc: "You may be asked to present to a panel including peers, the hiring manager, and cross-functional stakeholders (HR, Finance, Technology). They're assessing executive presence, communication clarity, and how you handle pushback. Structure your answers, hold the room, and embrace challenging questions.",
      tips: ["Slow down — panels reward deliberate speakers", "Acknowledge pushback before responding", "Use data to anchor every recommendation", "End every response with a forward-looking statement"]
    },
    vp: {
      title: "Stage 4 — VP / Executive Interview",
      desc: "This is typically a 30-45 minute conversation with a VP or CPO. They're assessing strategic maturity, enterprise thinking, risk intelligence, and whether you'll represent the sourcing function credibly at senior levels. Lead with perspective, not just experience.",
      tips: ["Think out loud on complex questions — show your reasoning", "Reference enterprise-level implications, not just category tactics", "Demonstrate risk and regulatory fluency", "Ask one sharp question at the end"]
    }
  };
  const i = intros[stage];
  if (!i) return '';
  return `<h2>${i.title}</h2><p>${i.desc}</p><div class="tips">${i.tips.map(t => `<span class="tip-chip">${t}</span>`).join('')}</div>`;
}

function renderOverview() {
  const totalQ = Object.values(QUESTIONS).reduce((a, b) => a + b.length, 0);
  const attempted = Object.keys(scores).length;
  const nailed = Object.values(scores).filter(s => s === 'easy').length;
  const working = Object.values(scores).filter(s => s === 'medium').length;
  const tough = Object.values(scores).filter(s => s === 'hard').length;

  return `
    <div class="stage-intro">
      <h2>Welcome, Tolulope</h2>
      <p>This is your personal interview preparation coach for the <strong>BMO Financial Group — Senior Manager, Strategic Sourcing (External Labour)</strong> role. All answers are grounded in your actual resume, the BMO job description, and the strategic sourcing knowledge base. Work through each stage in order, or jump to any stage you want to focus on.</p>
    </div>
    <div class="overview-grid">
      <div class="stat-card"><div class="stat-label">Total questions</div><div class="stat-val">${totalQ}</div><div class="stat-sub">across 4 interview stages</div></div>
      <div class="stat-card"><div class="stat-label">Attempted</div><div class="stat-val">${attempted}</div><div class="stat-sub">questions practiced</div></div>
      <div class="stat-card"><div class="stat-label">Nailed it</div><div class="stat-val" style="color:#2e7d32">${nailed}</div><div class="stat-sub">strong answers</div></div>
      <div class="stat-card"><div class="stat-label">Need work</div><div class="stat-val" style="color:#a32d2d">${tough}</div><div class="stat-sub">flag for review</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:1.5rem">
      ${["hr","hm","tp","vp"].map(s => {
        const qs = QUESTIONS[s];
        const done = Object.keys(scores).filter(k => k.startsWith(s+'-')).length;
        const pct = Math.round((done / qs.length) * 100);
        const labels = { hr: "HR Screen", hm: "Hiring Manager", tp: "Team Panel", vp: "VP Executive" };
        return `<div class="stat-card" style="cursor:pointer" onclick="setStage('${s}')">
          <div class="stat-label">${labels[s]}</div>
          <div class="stat-val">${qs.length} <span style="font-size:14px;font-weight:400;color:#888">questions</span></div>
          <div style="margin-top:8px;height:4px;background:#e0ddd6;border-radius:2px;overflow:hidden"><div style="width:${pct}%;height:100%;background:#0a2d5e;border-radius:2px"></div></div>
          <div class="stat-sub" style="margin-top:4px">${done}/${qs.length} attempted</div>
        </div>`;
      }).join('')}
    </div>
    <div class="stage-intro" style="background:#f0f4ff;border-color:#b5d4f4">
      <h2 style="color:#185fa5">How to use this coach</h2>
      <p><strong>Practice Mode:</strong> Question appears first. Think through your answer mentally, then reveal the strong answer and score yourself. <strong>Study Mode:</strong> Question and answer appear together for review. Use the Power Tips tab for BMO-specific coaching notes that will set you apart from other candidates.</p>
    </div>
  `;
}

function renderTips() {
  return `
    <div class="stage-intro">
      <h2>Power Tips — BMO Specific Coaching</h2>
      <p>These are the insider observations that will separate you from other well-qualified candidates. Each tip is grounded in BMO's own sourcing methodology and the documents in your preparation kit.</p>
    </div>
    ${TIPS.map((t, i) => `
      <div class="card" style="min-height:auto;margin-bottom:12px;padding:1.25rem 1.5rem">
        <div style="display:flex;align-items:flex-start;gap:12px">
          <div style="min-width:28px;height:28px;border-radius:50%;background:#0a2d5e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:2px">${i+1}</div>
          <div>
            <div style="font-weight:600;font-size:15px;color:#0a2d5e;margin-bottom:6px">${t.title}</div>
            <div style="font-size:14px;line-height:1.7;color:#333">${t.body}</div>
          </div>
        </div>
      </div>
    `).join('')}
  `;
}

function renderDone() {
  const qs = getQs();
  const stageLabels = { hr: "HR Screen", hm: "Hiring Manager", tp: "Team Panel", vp: "VP Executive" };
  const nailed = Object.keys(scores).filter(k => k.startsWith(currentStage+'-') && scores[k] === 'easy').length;
  const working = Object.keys(scores).filter(k => k.startsWith(currentStage+'-') && scores[k] === 'medium').length;
  const hard = Object.keys(scores).filter(k => k.startsWith(currentStage+'-') && scores[k] === 'hard').length;
  
  return `
    <div class="done-screen">
      <div style="font-size:40px;margin-bottom:1rem">✓</div>
      <h3>${stageLabels[currentStage]} — Complete</h3>
      <p>You've worked through all ${qs.length} questions for this stage. Here's how you scored yourself.</p>
      <div class="done-stats">
        <div class="done-stat"><div class="n" style="color:#2e7d32">${nailed}</div><div class="l">Nailed it</div></div>
        <div class="done-stat"><div class="n" style="color:#ba7517">${working}</div><div class="l">Getting there</div></div>
        <div class="done-stat"><div class="n" style="color:#a32d2d">${hard}</div><div class="l">Need work</div></div>
      </div>
      ${hard > 0 ? `<p style="color:#a32d2d;font-size:13px">You flagged ${hard} question${hard>1?'s':''} as needing more work. Use Study Mode to review those answers until they feel natural.</p>` : ''}
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:1rem">
        <button class="nav-btn primary" onclick="restartStage()">Restart this stage</button>
        <button class="nav-btn" onclick="setStage('overview')">Back to overview</button>
      </div>
    </div>
  `;
}

function setMode(m) {
  mode = m;
  revealed = false;
  renderMain();
}

function revealAnswer() {
  revealed = !revealed;
  renderMain();
}

function markScore(s) {
  scores[`${currentStage}-${currentQ}`] = s;
  renderMain();
}

function nextQ() {
  const qs = getQs();
  if (currentQ < qs.length - 1) {
    currentQ++;
    revealed = false;
    renderMain();
  } else {
    currentQ = qs.length;
    renderMain();
  }
  if (currentStage in stageProgress) {
    stageProgress[currentStage] = Math.max(stageProgress[currentStage], currentQ);
  }
}

function prevQ() {
  if (currentQ > 0) {
    currentQ--;
    revealed = false;
    renderMain();
  }
}

function restartStage() {
  currentQ = 0;
  revealed = false;
  renderMain();
}

function renderSearch() {
  const el = document.getElementById("mainContent");
  if (!el) return;
  const results = searchQuestions(searchQuery);
  const hasQuery = searchQuery.trim().length >= 2;

  var html = '<div class="stage-intro"><h2>Search &amp; Ask AI</h2><p>Search the full question bank by keyword. If your question is not covered, type it below — Claude will generate a tailored answer using your resume and the BMO knowledge base, then save it to your bank.</p></div>';

  html += '<div class="search-wrap">';
  html += '<span class="search-icon">&#128269;</span>';
  html += '<input class="search-input" type="text" id="searchField" placeholder="Search by keyword e.g. OSFI, rate card, negotiation, STAR..." oninput="handleSearchInput(this.value)" />';
  if (searchQuery) html += '<button class="search-clear" onclick="clearSearch()">&#215;</button>';
  html += '</div>';

  if (hasQuery && results.length > 0) {
    html += renderSearchResults(results);
    html += '<div style="margin-top:1.5rem">' + renderAiBox() + '</div>';
  } else if (hasQuery && results.length === 0) {
    html += '<div class="no-results"><h3>No matching questions found</h3><p>No existing questions match that search. Use the Claude generator below to create and save a new answer.</p></div>';
    html += renderAiBox();
  } else {
    html += renderAiBox();
  }

  el.innerHTML = html;

  var sf = document.getElementById("searchField");
  if (sf) {
    sf.value = searchQuery;
    sf.focus();
    var len = sf.value.length;
    sf.setSelectionRange(len, len);
  }
}

function renderSearchResults(results) {
  var expanded = expandedSearchResult;
  var html = '<div class="search-results-label">' + results.length + ' result' + (results.length !== 1 ? 's' : '') + ' found</div>';
  results.forEach(function(r, i) {
    var isOpen = expanded === i;
    if (isOpen) {
      html += '<div class="search-expanded-card">';
      html += '<div class="se-header"><div>';
      html += '<div class="sr-stage">' + r.stageLabel + ' &middot; ' + r.category + (r.isCustom ? ' &middot; <span style="color:#0f6e56;font-weight:700">AI Generated</span>' : '') + '</div>';
      html += '<div style="font-size:16px;font-weight:500;color:#111;line-height:1.5">' + esc(r.q) + '</div>';
      html += '</div><button class="se-close" onclick="collapseResult()">&#215;</button></div>';
      html += '<div style="font-size:10.5px;font-weight:700;color:#2e7d32;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;margin-top:1rem;border-top:1px solid #f0ede8;padding-top:1rem">Strong answer</div>';
      html += '<div style="font-size:14px;line-height:1.75;color:#222">' + formatAnswer(r.a) + '</div>';
      html += '<div class="se-coaching"><strong style="color:#534ab7">Coaching note:</strong> ' + esc(r.coaching) + '</div>';
      html += '<div style="margin-top:1rem;display:flex;gap:8px">';
      html += '<button class="nav-btn" onclick="goToQuestion(\'' + r.stage + '\',' + r.idx + ')">Go to this question &rarr;</button>';
      html += '<button class="nav-btn" onclick="collapseResult()">Collapse</button></div>';
      html += '</div>';
    } else {
      var preview = r.a.replace(/\n/g,' ').substring(0, 130) + '...';
      html += '<div class="search-result-card" onclick="expandResult(' + i + ')">';
      html += '<div class="sr-stage">' + r.stageLabel + ' &middot; ' + r.category + (r.isCustom ? ' &middot; <span style="color:#0f6e56;font-weight:700">AI Generated</span>' : '') + '</div>';
      html += '<div class="sr-q">' + esc(r.q) + '</div>';
      html += '<div class="sr-preview">' + esc(preview) + '</div>';
      html += '<span class="sr-cat">Click to expand answer</span>';
      html += '</div>';
    }
  });
  return html;
}

    html += '<div class="ai-result-card">';
    html += '<div class="ai-q-label">Question</div>';
    html += '<div class="ai-q-text">' + esc(aiResult.q) + '</div>';
    if (!aiResult.isError) {
      html += '<div class="ai-a-label" style="margin-top:1rem;padding-top:1rem;border-top:1px solid #dce8f8">Strong answer</div>';
      html += '<div class="ai-a-text">' + formatAnswer(aiResult.a) + '</div>';
      if (aiResult.coaching) {
        html += '<div style="margin-top:1rem;background:#f9f6ff;border:0.5px solid #cdc8f5;border-radius:8px;padding:0.75rem 1rem;font-size:13px;color:#534ab7;line-height:1.6"><strong>Coaching note:</strong> ' + esc(aiResult.coaching) + '</div>';
      }
      html += '<div class="ai-save-row"><button class="ai-save-btn" onclick="saveAiAnswer()">Save to question bank</button><button class="ai-discard-btn" onclick="discardAiAnswer()">Discard</button></div>';

    }
    html += '</div>';
  }

  html += '</div>';
  return html;
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function syncAiQ(el) {

function handleSearchInput(val) {

function clearSearch() {

function collapseResult() {

function goToQuestion(stage, idx) {

function getAllQuestions() {
  var all = [];
  var SLABELS = {hr:'HR Screen',hm:'Hiring Manager',tp:'Team Panel',vp:'VP Executive'};
  ['hr','hm','tp','vp'].forEach(function(stage) {
    var base = QUESTIONS[stage] || [];
    var custom = customQuestions[stage] || [];
    var combined = base.concat(custom);
    combined.forEach(function(q, idx) {
      all.push(Object.assign({}, q, { stage: stage, stageLabel: SLABELS[stage], idx: idx, isCustom: idx >= base.length }));
    });
  });
  return all;
}

function searchQuestions(query) {
  if (!query || query.trim().length < 2) return [];
  var q = query.toLowerCase();
  return getAllQuestions().filter(function(item) {
    return item.q.toLowerCase().includes(q) || item.a.toLowerCase().includes(q) || item.category.toLowerCase().includes(q) || item.stageLabel.toLowerCase().includes(q);
  });
}

async function generateAiAnswer() {
  var stageSelect = document.getElementById('aiStageSelect');
  var question = (aiDraftQuestion || '').trim();
  if (!question) { alert('Please type a question first.'); return; }
  if (!apiKey || !apiKey.trim().startsWith('sk-')) { alert('Please enter and save your Anthropic API key first.'); return; }

  var stage = stageSelect ? stageSelect.value : 'hm';
  aiSelectedStage = stage;
  var stageCtx = {
    hr: 'HR Screener / Talent Acquisition — assessing fit, background, motivation, logistics. Warm, narrative answers work best.',
    hm: 'Hiring Manager / Director of Procurement — assessing technical sourcing depth, category expertise, commercial judgment. Be specific and use STAR with insight.',
    tp: 'Cross-functional Panel (HR, Finance, Technology) — assessing executive presence, collaboration, how you handle pushback.',
    vp: 'VP or CPO — assessing strategic maturity, enterprise thinking, risk intelligence. Be concise and lead with perspective.'
  };

  aiGenerating = true;
  aiResult = null;
  renderSearch();

  var systemPrompt = "You are an expert interview coach helping Tolulope Adebisi prepare for the BMO Financial Group Senior Manager, Strategic Sourcing (External Labour) role in Toronto, Canada.\n\nCANDIDATE BACKGROUND:\n" + RESUME_CONTEXT + "\n\nROLE & COMPANY CONTEXT:\n" + BMO_CONTEXT + "\n\nINTERVIEWER CONTEXT: " + stageCtx[stage] + "\n\nGenerate a strong, human, confident interview answer that:\n1. Sounds like Tolulope speaking naturally — senior Toronto market professional voice\n2. Draws on Tolulope's actual experience (Maestrogrid, Rhea Carrison, Plural Health, FITC, Krystal)\n3. References BMO-relevant context naturally (7-step framework, OSFI, rate cards, VMS, dual-panel model)\n4. Is calibrated for the specific interviewer type above\n5. Uses STAR structure for behavioral questions but leads with insight not just sequence\n6. Includes specific numbers and outcomes from the resume where relevant\n\nAlso generate a 1-2 sentence coaching note.\n\nRespond ONLY with valid JSON in this exact format (no markdown, no preamble):\n{\"answer\": \"full answer text, use \\\\n\\\\n for paragraph breaks\", \"coaching\": \"coaching note\"}";

  try {
    var resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey.trim(),
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1200,
        system: systemPrompt,
        messages: [{ role: 'user', content: 'Interview question to answer: "' + question + '"' }]
      })
    });

    if (!resp.ok) {
      var errData = await resp.json().catch(function() { return {}; });
      throw new Error(errData.error ? errData.error.message : 'API error ' + resp.status);
    }

    var data = await resp.json();
    var raw = (data.content && data.content[0] && data.content[0].text) ? data.content[0].text : '';
    var parsed;
    try {
      var match = raw.match(/\{[\s\S]*\}/);
      parsed = JSON.parse(match ? match[0] : raw);
    } catch(e) {
      parsed = { answer: raw, coaching: 'Review and adapt this answer to your own voice.' };
    }
    aiResult = { q: question, a: parsed.answer || raw, coaching: parsed.coaching || '', stage: stage };
  } catch(e) {
    aiResult = { q: question, a: 'Error: ' + e.message + '. Check your API key and try again.', coaching: '', stage: stage, isError: true };
  }

  aiGenerating = false;
  renderSearch();
}

function saveAiAnswer() {
  if (!aiResult || aiResult.isError) return;
  var entry = {
    category: 'AI Generated',
    q: aiResult.q,
    a: aiResult.a,
    coaching: aiResult.coaching || 'AI-generated answer — adapt to your own voice before using.'
  };
  if (!customQuestions[aiResult.stage]) customQuestions[aiResult.stage] = [];
  customQuestions[aiResult.stage].push(entry);
  searchQuery = aiResult.q.substring(0, 50);
  aiResult = null;
  aiDraftQuestion = '';
  renderSearch();
}

function discardAiAnswer() {
