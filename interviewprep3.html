<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Coach — Tolulope Adebisi | GE Healthcare</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0e0e12;--ink2:#3a3a44;--ink3:#7a7a88;
  --cream:#f8f6f1;--paper:#fffffe;
  --ge-navy:#003087;--ge-teal:#00858a;--ge-gold:#c8a951;
  --success:#1a7a4a;--warn:#b85c00;--danger:#8b2020;
  --border:#e4e0d8;--border2:#d0ccc2;
  --highlight:#fff8d0;--highlight-b:#e6d800;
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;font-size:14px}

/* Header */
.app-header{background:var(--ge-navy);color:#fff;padding:1rem 1.75rem;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--ge-teal)}
.header-left h1{font-family:'DM Serif Display',serif;font-size:18px;font-weight:400;letter-spacing:-0.01em;color:#fff}
.header-left p{font-size:11px;opacity:0.65;margin-top:3px;letter-spacing:0.03em;text-transform:uppercase}
.header-badge{background:var(--ge-teal);color:#fff;font-size:10px;font-weight:600;padding:4px 12px;border-radius:2px;letter-spacing:0.08em;text-transform:uppercase}

/* API Bar */
.api-bar{background:#fff;border-bottom:1px solid var(--border);padding:0.6rem 1.75rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.api-bar label{font-size:11px;font-weight:600;color:var(--ink2);white-space:nowrap;text-transform:uppercase;letter-spacing:0.05em}
.key-wrap{position:relative;flex:1;min-width:200px;max-width:340px}
.key-input{width:100%;padding:0.4rem 2.25rem 0.4rem 0.75rem;font-size:12px;border:1px solid var(--border2);border-radius:4px;color:var(--ink);background:var(--cream);font-family:monospace;outline:none;transition:border 0.15s}
.key-input:focus{border-color:var(--ge-navy)}
.key-toggle{position:absolute;right:0.6rem;top:50%;transform:translateY(-50%);background:none;border:none;font-size:12px;cursor:pointer;color:var(--ink3)}
.key-save{padding:0.4rem 0.9rem;font-size:11px;font-weight:600;border:1px solid var(--ge-navy);background:var(--ge-navy);color:#fff;border-radius:4px;cursor:pointer;text-transform:uppercase;letter-spacing:0.05em}
.key-save:hover{background:#00225c}
.key-status{font-size:11px;font-weight:500;padding:3px 9px;border-radius:10px}
.key-status.set{background:#d4f0e4;color:#1a7a4a}
.key-status.unset{background:#fce8e8;color:#8b2020}
.api-note{font-size:10px;color:var(--ink3);flex-basis:100%;margin-top:1px}

/* Nav */
.nav{display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;padding:0 1.75rem}
.nav-btn{padding:0.75rem 1rem;font-size:12px;font-weight:500;color:var(--ink3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.15s;letter-spacing:0.02em}
.nav-btn:hover{color:var(--ink)}
.nav-btn.active{color:var(--ge-navy);border-bottom-color:var(--ge-navy);font-weight:600}
.nav-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px;margin-left:5px;vertical-align:middle;letter-spacing:0.03em}
.b-hr{background:#d4f0e4;color:#1a7a4a}.b-hm{background:#ddeefa;color:#185fa5}
.b-tp{background:#fce8d0;color:#b85c00}.b-vp{background:#eedff8;color:#6636a8}
.b-tip{background:#e6f9f0;color:#0f6e56}.b-ai{background:#fff0cc;color:#8a5a00}
.b-gaps{background:#fce8e8;color:#8b2020}
.b-grader{background:#f0eaff;color:#5a2ca0}.b-gameday{background:#fff3cc;color:#7a4e00}

/* Layout */
.layout{display:flex;min-height:calc(100vh - 148px)}
.side-resume{width:300px;min-width:160px;background:#fff;border-right:1px solid var(--border);overflow-y:auto;padding:1rem 1.25rem;flex-shrink:0;font-size:12px}
.side-resume-header{font-size:10px;font-weight:700;color:var(--ge-teal);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.75rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.res-sec{border-radius:6px;padding:0.65rem 0.8rem;margin-bottom:6px;border:1px solid var(--border);background:var(--cream);transition:all 0.25s}
.res-sec.lit{background:var(--highlight);border-color:var(--highlight-b);animation:flash 0.4s ease-out}
@keyframes flash{0%{background:#fffaaa}100%{background:var(--highlight)}}
.res-sec-title{font-size:12px;font-weight:600;color:var(--ge-navy);margin-bottom:2px}
.res-sec.lit .res-sec-title{color:#4a3800}
.res-sec-sub{font-size:10.5px;color:var(--ink3);margin-bottom:4px}
.res-sec-body{font-size:11.5px;color:var(--ink2);line-height:1.55}
.res-sec.lit .res-sec-body{color:#3a3000}
.ref-tag{font-size:9.5px;font-weight:700;color:#5a4200;background:#f5dd60;padding:1px 7px;border-radius:4px;display:inline-block;margin-bottom:4px}
.res-hint{background:#edf5ff;border:1px solid #b5d4f4;border-radius:6px;padding:0.5rem 0.7rem;margin-bottom:8px;font-size:11px;color:#185fa5;line-height:1.5}

.resize-h{width:5px;min-width:5px;background:var(--border);cursor:col-resize;flex-shrink:0;transition:background 0.15s;display:flex;align-items:center;justify-content:center}
.resize-h:hover,.resize-h.drag{background:var(--ge-navy)}
.resize-h::after{content:'';display:block;width:2px;height:28px;background:rgba(255,255,255,0.6);border-radius:2px}

.main-col{flex:1;min-width:0;overflow-y:auto}
.main-inner{max-width:800px;margin:0 auto;padding:1.75rem 1.5rem}

.jd-resize{width:5px;min-width:5px;background:var(--border);cursor:col-resize;flex-shrink:0;transition:background 0.15s;display:flex;align-items:center;justify-content:center}
.jd-resize:hover,.jd-resize.drag{background:var(--ge-teal)}
.jd-resize::after{content:'';display:block;width:2px;height:28px;background:rgba(255,255,255,0.6);border-radius:2px}

.side-jd{width:300px;min-width:160px;background:#fff;border-left:1px solid var(--border);overflow-y:auto;padding:1rem 1.25rem;flex-shrink:0;font-size:12px}
.side-jd.collapsed{width:40px!important;min-width:40px;overflow:hidden;padding:0}
.jd-header{font-size:10px;font-weight:700;color:var(--ge-teal);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.75rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;white-space:nowrap}
.jd-tab{display:none;writing-mode:vertical-rl;font-size:10px;font-weight:700;color:var(--ge-teal);letter-spacing:0.1em;text-transform:uppercase;padding:1rem 0.6rem;cursor:pointer;white-space:nowrap;height:100%;align-items:center;justify-content:center}
.side-jd.collapsed .jd-tab{display:flex}
.side-jd.collapsed .jd-inner{display:none}
.jd-sec{border-radius:6px;padding:0.65rem 0.8rem;margin-bottom:6px;border:1px solid var(--border);background:var(--cream);transition:all 0.25s}
.jd-sec.lit{background:var(--highlight);border-color:var(--highlight-b);animation:flash 0.4s ease-out}
.jd-sec-title{font-size:11.5px;font-weight:600;color:#085041;margin-bottom:3px}
.jd-sec.lit .jd-sec-title{color:#4a5200}
.jd-sec-body{font-size:11px;color:var(--ink2);line-height:1.55}
.jd-sec.lit .jd-sec-body{color:#3a3000}
.jd-ref{font-size:9.5px;font-weight:700;color:#5a4200;background:#f5dd60;padding:1px 7px;border-radius:4px;display:inline-block;margin-bottom:4px}

/* Stage intro */
.stage-intro{background:#fff;border:1px solid var(--border);border-radius:10px;padding:1.1rem 1.25rem;margin-bottom:1.25rem;border-left:4px solid var(--ge-navy)}
.stage-intro h2{font-family:'DM Serif Display',serif;font-size:17px;font-weight:400;color:var(--ge-navy);margin-bottom:0.35rem}
.stage-intro p{font-size:13px;color:var(--ink2);line-height:1.65}
.stage-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:0.65rem}
.chip{font-size:11px;background:var(--cream);color:var(--ink2);padding:3px 10px;border-radius:12px;border:1px solid var(--border2)}

/* Mode & Length toggles */
.mode-row{display:flex;gap:8px;align-items:center;background:var(--cream);border-radius:6px;padding:3px;margin-bottom:1rem;border:1px solid var(--border)}
.mode-opt{padding:0.4rem 0.9rem;font-size:12px;font-weight:500;border:none;background:none;border-radius:4px;cursor:pointer;color:var(--ink3);transition:all 0.15s}
.mode-opt.active{background:#fff;color:var(--ge-navy);box-shadow:0 1px 4px rgba(0,0,0,0.07);font-weight:600}

.len-tabs{display:flex;gap:4px;margin-bottom:0.5rem}
.len-btn{font-size:11px;padding:4px 10px;border-radius:12px;border:1px solid var(--border2);background:var(--cream);color:var(--ink3);cursor:pointer;font-weight:500;transition:all 0.15s}
.len-btn:hover{background:#fff;color:var(--ge-navy)}
.len-btn.active{background:var(--ge-navy);color:#fff;border-color:var(--ge-navy)}

/* Metrics */
.metrics-row{display:flex;gap:12px;align-items:center;margin-bottom:0.75rem;padding-bottom:0.75rem;border-bottom:1px solid var(--border)}
.metric-badge{font-size:11px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:4px}
.metric-badge span{color:var(--ink3);font-weight:400}
.human-score.high{color:var(--success)}
.human-score.med{color:var(--warn)}
.human-score.low{color:var(--danger)}

/* Progress */
.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
.prog-bar{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--ge-teal);border-radius:2px;transition:width 0.3s}
.prog-label{font-size:11px;color:var(--ink3);white-space:nowrap}

/* Card */
.q-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:1.5rem;min-height:300px;display:flex;flex-direction:column}
.q-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:0.85rem;gap:10px}
.q-num{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:0.07em}
.q-cat{font-size:11px;color:var(--ink3);background:var(--cream);padding:3px 9px;border-radius:8px;border:1px solid var(--border);white-space:nowrap}
.q-text{font-family:'DM Serif Display',serif;font-size:20px;font-weight:400;line-height:1.5;color:var(--ink);flex:1;font-style:italic}

.reveal-btn{margin-top:1.25rem;padding:0.65rem 1.4rem;background:var(--ge-navy);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;transition:background 0.15s;align-self:flex-start}
.reveal-btn:hover{background:#00225c}

.answer-block{margin-top:1.1rem;border-top:1px solid var(--border);padding-top:1.1rem;display:none}
.answer-block.show{display:block}
.answer-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem}
.answer-label-text{font-size:9.5px;font-weight:700;letter-spacing:0.1em;color:var(--success);text-transform:uppercase;}

/* Standardised answer text */
.answer-text p{font-size:14.5px;line-height:1.65;color:#1a1a22;margin-bottom:0.85rem}
.answer-text p:last-child{margin-bottom:0}

.coach-note{margin-top:0.85rem;background:#f5f0ff;border:1px solid #d8cefc;border-radius:6px;padding:0.75rem 0.9rem;font-size:12.5px;color:#5a3faa;line-height:1.6}
.coach-note strong{font-weight:600}

.score-row{display:flex;gap:8px;margin-top:1.2rem;flex-wrap:wrap;align-items:center;padding-top:1rem;border-top:1px dashed var(--border)}
.score-label{font-size:11.5px;color:var(--ink3)}
.score-btn{padding:0.4rem 0.9rem;font-size:12px;border-radius:14px;border:1px solid;cursor:pointer;font-weight:500;transition:all 0.12s}
.score-btn.easy{border-color:var(--success);color:var(--success);background:#f0fbf5}
.score-btn.easy:hover,.score-btn.easy.picked{background:var(--success);color:#fff}
.score-btn.med{border-color:var(--warn);color:var(--warn);background:#fff5ec}
.score-btn.med:hover,.score-btn.med.picked{background:var(--warn);color:#fff}
.score-btn.hard{border-color:var(--danger);color:var(--danger);background:#fdf0f0}
.score-btn.hard:hover,.score-btn.hard.picked{background:var(--danger);color:#fff}

/* Nav controls */
.nav-controls{display:flex;align-items:center;justify-content:space-between;margin-top:1.25rem}
.ctrl-btn{padding:0.6rem 1.1rem;border:1px solid var(--border2);background:#fff;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink2);cursor:pointer;transition:all 0.15s}
.ctrl-btn:hover:not(:disabled){background:var(--cream);border-color:var(--ink3)}
.ctrl-btn:disabled{opacity:0.25;cursor:not-allowed}
.ctrl-btn.primary{background:var(--ge-navy);color:#fff;border-color:var(--ge-navy)}
.ctrl-btn.primary:hover:not(:disabled){background:#00225c}

/* Overview */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:1.25rem}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:0.9rem 1rem}
.stat-l{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink3);margin-bottom:4px}
.stat-n{font-size:24px;font-weight:600;color:var(--ge-navy)}
.stat-s{font-size:11.5px;color:var(--ink3);margin-top:2px}
.stage-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:1.25rem}
.stage-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:0.9rem 1rem;cursor:pointer;transition:all 0.15s}
.stage-card:hover{border-color:var(--ge-navy);box-shadow:0 2px 8px rgba(0,48,135,0.08)}
.stage-prog{margin-top:8px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.stage-prog-fill{height:100%;background:var(--ge-teal);border-radius:2px}

/* Tips */
.tip-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:1.1rem 1.25rem;margin-bottom:10px;display:flex;gap:12px}
.tip-num{min-width:26px;height:26px;border-radius:50%;background:var(--ge-navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:2px;flex-shrink:0}
.tip-title{font-weight:600;font-size:14px;color:var(--ge-navy);margin-bottom:5px}
.tip-body{font-size:13px;line-height:1.7;color:var(--ink2)}

/* Done screen */
.done-screen{text-align:center;padding:3rem 2rem}
.done-screen h3{font-family:'DM Serif Display',serif;font-size:24px;font-weight:400;color:var(--ge-navy);margin-bottom:0.6rem}
.done-stats{display:flex;gap:20px;justify-content:center;margin:1.5rem 0;flex-wrap:wrap}
.done-stat .n{font-size:32px;font-weight:600}
.done-stat .l{font-size:12px;color:var(--ink3)}

/* Search */
.search-wrap{position:relative;margin-bottom:1rem}
.search-input{width:100%;padding:0.8rem 1rem 0.8rem 2.5rem;font-size:14px;border:1px solid var(--border2);border-radius:8px;background:#fff;color:var(--ink);outline:none;transition:border 0.15s}
.search-input:focus{border-color:var(--ge-navy)}
.search-icon{position:absolute;left:0.85rem;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:15px;pointer-events:none}
.search-clear{position:absolute;right:0.85rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--ink3);font-size:17px;cursor:pointer;line-height:1;padding:0}
.sr-label{font-size:11px;color:var(--ink3);margin-bottom:0.65rem;font-weight:500}
.sr-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:0.9rem 1.1rem;margin-bottom:8px;cursor:pointer;transition:all 0.15s}
.sr-card:hover{border-color:var(--ge-navy);box-shadow:0 0 0 2px rgba(0,48,135,0.06)}
.sr-stage{font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.sr-q{font-size:14px;font-weight:500;color:var(--ink);line-height:1.45;margin-bottom:5px}
.sr-preview{font-size:12.5px;color:var(--ink2);line-height:1.5}
.sr-expanded{background:#fff;border:1.5px solid var(--ge-navy);border-radius:12px;padding:1.25rem;margin-bottom:8px}
.sr-exp-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;gap:10px}
.sr-exp-close{background:none;border:none;font-size:20px;color:var(--ink3);cursor:pointer;line-height:1;padding:0;flex-shrink:0}

/* AI Box */
.ai-box{background:#fff;border:1px dashed #b5d4f4;border-radius:10px;padding:1.25rem}
.ai-box h4{font-family:'DM Serif Display',serif;font-size:15px;font-weight:400;color:var(--ge-navy);margin-bottom:0.35rem}
.ai-box p{font-size:13px;color:var(--ink2);margin-bottom:0.9rem;line-height:1.6}
.ai-q-area{min-height:80px;padding:0.65rem;font-size:13.5px;border:1px solid var(--border2);border-radius:6px;background:var(--cream);color:var(--ink);line-height:1.65;cursor:text;white-space:pre-wrap;outline:none;margin-bottom:0.85rem}
.ai-q-area:focus{border-color:var(--ge-navy)}
.ai-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:0.85rem}
.ai-stage-sel{padding:0.45rem 0.8rem;border:1px solid var(--border2);border-radius:6px;font-size:12px;color:var(--ink);background:#fff;outline:none}
.ai-gen-btn{padding:0.6rem 1.25rem;background:var(--ge-navy);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;transition:background 0.15s}
.ai-gen-btn:hover:not(:disabled){background:#00225c}
.ai-gen-btn:disabled{opacity:0.45;cursor:not-allowed}
.ai-key-warn{background:#fff8e8;border:1px solid #f5d080;border-radius:6px;padding:0.6rem 0.9rem;font-size:12px;color:#7a4a00;margin-bottom:0.85rem;line-height:1.5}
.ai-result{background:#f5fbff;border:1px solid #b5d4f4;border-radius:10px;padding:1.25rem;margin-top:0.9rem}
.ai-qlabel{font-size:9.5px;font-weight:700;color:#185fa5;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px}
.ai-qtext{font-family:'DM Serif Display',serif;font-size:16px;font-weight:400;color:var(--ink);margin-bottom:0.9rem;line-height:1.5;font-style:italic}
.ai-alabel{font-size:9.5px;font-weight:700;color:var(--success);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px;margin-top:1rem;padding-top:1rem;border-top:1px solid #d0e8f5}
.ai-save-row{display:flex;gap:8px;margin-top:1rem;flex-wrap:wrap}
.ai-save{padding:0.55rem 1.1rem;font-size:12.5px;font-weight:500;border-radius:6px;cursor:pointer;background:var(--ge-navy);color:#fff;border:1px solid var(--ge-navy)}
.ai-save:hover{background:#00225c}
.ai-discard{padding:0.55rem 1.1rem;font-size:12.5px;font-weight:500;border-radius:6px;cursor:pointer;background:#fff;color:var(--ink2);border:1px solid var(--border2)}
.ai-discard:hover{background:var(--cream)}
.gen-loading{display:flex;align-items:center;gap:10px;padding:1rem;font-size:13px;color:#185fa5}
.dots{display:flex;gap:4px}
.dots span{width:5px;height:5px;border-radius:50%;background:#185fa5;animation:dot 1.2s infinite}
.dots span:nth-child(2){animation-delay:0.2s}
.dots span:nth-child(3){animation-delay:0.4s}
@keyframes dot{0%,80%,100%{opacity:0.15}40%{opacity:1}}

/* Weakness section */
.gap-box{background:#fff8f8;border:1px solid #f5c0c0;border-left:4px solid var(--danger);border-radius:8px;padding:1rem 1.1rem;margin-bottom:10px}
.gap-box h3{font-size:13.5px;font-weight:600;color:var(--danger);margin-bottom:5px}
.gap-box p{font-size:13px;color:var(--ink2);line-height:1.65}
.gap-bridge{background:#edf8f0;border:1px solid #9ad4b3;border-left:4px solid var(--success);border-radius:8px;padding:0.9rem 1.1rem;margin-top:8px}
.gap-bridge .bridge-label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--success);margin-bottom:5px}
.gap-bridge p{font-size:13px;color:var(--ink2);line-height:1.65}

/* Answer Grader */
.grader-wrap{background:#fff;border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.25rem}
.grader-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink3);margin-bottom:6px}

.grader-q-sel{width:100%;padding:0.55rem 0.8rem;font-size:13px;border:1px solid var(--border2);border-radius:6px;color:var(--ink);background:#fff;outline:none;margin-bottom:0.85rem}

.score-pill{background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:0.75rem 1rem}

.voice-timer{font-size:11px;color:var(--danger);font-weight:700;min-width:32px;display:none}

<script>
// ─── FILTERS & METRICS ─────────────────────────────────
const bannedWords = [
  "intersection of", "commercial vulnerability", "synergy realization", 
  "strategic leverage model", "value architecture", "paradigm shift", "leverage"
];

function cleanBuzzwords(text) {
  if(!text) return "";
  let cleaned = text;
  bannedWords.forEach(word => {
    const regex = new RegExp(`\\b${word}\\b`, "gi");
    cleaned = cleaned.replace(regex, ""); 
  });
  return cleaned.replace(/\s{2,}/g, ' ').trim();
}

function speakingTime(text) {
  if(!text) return 0;
  const plainText = text.replace(/<[^>]*>?/gm, '');
  const words = plainText.split(/\s+/).length;
  return Math.ceil((words / 140) * 60); // seconds based on 140 wpm
}

function humanScore(text) {
  if(!text) return 100;
  let score = 100;
  const plainText = text.replace(/<[^>]*>?/gm, '');
  if(plainText.length > 1100) score -= 15;
  if((plainText.match(/strategic/gi)||[]).length > 2) score -= 10;
  if((plainText.match(/synergy/gi)||[]).length > 2) score -= 10;
  if((plainText.match(/framework/gi)||[]).length > 2) score -= 10;
  return Math.max(0, score);
}

// ─── DATA ───────────────────────────────────────────────
const STAGES=[
  {id:"overview",label:"Overview",badge:null},
  {id:"hr",label:"HR Screen",badge:"HR",bc:"b-hr"},
  {id:"hm",label:"Hiring Manager",badge:"HM",bc:"b-hm"},
  {id:"tp",label:"Team Panel",badge:"Panel",bc:"b-tp"},
  {id:"vp",label:"VP / Executive",badge:"VP",bc:"b-vp"},
  {id:"gaps",label:"Hard Questions",badge:"Gaps",bc:"b-gaps"},
  {id:"tips",label:"Power Tips",badge:"Pro",bc:"b-tip"},
  {id:"grader",label:"Answer Grader",badge:"New",bc:"b-grader"},
  {id:"gameday",label:"Interview Day",badge:"Day-Of",bc:"b-gameday"},
  {id:"search",label:"Ask AI",badge:"AI",bc:"b-ai"}
];

// Structured answers: concise (45s), balanced (75s), detailed (90s+)
const QS={
hr:[
  {
    category:"Elevator Pitch",
    q:"Tell me about yourself and your sourcing background.",
    answer: {
      concise: `<p>I'm a Senior Procurement Manager currently at Maestrogrid. My expertise is bringing structure to decentralized environments. I built our IT and external labor frameworks from scratch, cutting time-to-award by 20%. I'm interested in this role because taking fragmented systems and building a governed model is exactly what M&A integration requires.</p>`,
      balanced: `<p>I'm currently a Senior Procurement Manager at Maestrogrid in Toronto. My background is in building enterprise category management frameworks from the ground up, especially for IT and software. Before Maestrogrid, I managed multi-region vendor portfolios at Rhea Carrison, standardizing processes and cutting costs by 12%.</p><p>I excel in environments that need structure—which is why this integration role caught my eye. It's essentially what I've been doing: taking fragmented systems, like what you see on Day 1 of an acquisition, and building a unified operating model.</p>`,
      detailed: `<p>I've spent over a decade in sourcing, primarily focusing on IT software and complex indirect categories. Right now, I'm at Maestrogrid. I was brought in to build their enterprise framework from scratch because they had a very decentralized setup—much like an M&A environment.</p><p>Previously, at Rhea Carrison, I led vendor rationalization across different regions. I had to work closely with HR, Finance, and IT leaders to change established vendor relationships. I also have experience at Plural Health managing IT procurement in a regulated clinical environment, which I know is critical for GE Healthcare.</p><p>Ultimately, my career has been about navigating complex stakeholder environments and building clear sourcing models. That's the exact skill set I want to bring to this integration lead role.</p>`
    },
    coaching:"Lead with your current role, then highlight the connection between your past work (structuring decentralized environments) and M&A integration.",
    resumeKeys:["maestrogrid","rhea","plural"],
    jdKeys:["integration_scope","disposition_strategy","project_mgmt"]
  },
  {
    category:"Motivations",
    q:"Why do you want this Sourcing Integration Lead role specifically?",
    answer: {
      concise: `<p>I'm drawn to this role because integrations are where procurement has the most immediate, visible impact on the business. I enjoy the challenge of taking two different sets of legacy contracts and deciding quickly what stays and what goes to ensure business continuity.</p>`,
      balanced: `<p>I enjoy the pace and impact of integration work. In a standard sourcing role, you manage predictable cycles. But after a merger, you inherit legacy contracts, different compliance standards, and overlapping tools, and you have to act quickly before timelines slip.</p><p>Every time I've walked into a fragmented environment, like at Maestrogrid or Rhea Carrison, I've found myself doing exactly this: building a master supplier list, identifying overlap, and aligning with Finance and IT to make disposition decisions. GE Healthcare is particularly interesting to me because of your recent spin-off experience—you know how critical it is to get transitions right.</p>`,
      detailed: `<p>Integrations are where procurement moves from a back-office function to a critical business protector. You're not just running RFPs; you're protecting continuity while capturing savings across a combined supplier base.</p><p>Every time I've walked into a fragmented environment, like at Maestrogrid or Rhea Carrison, I've done exactly this work: building the master supplier list nobody had, identifying overlapping vendors, and deciding with Legal and IT what stays and what goes. The only difference here is the formal integration context.</p><p>GE Healthcare specifically appeals to me because of your 2023 spin-off. Your leadership knows how complex unwinding systems can be. I want to work somewhere that takes integration sourcing as seriously as this role suggests.</p>`
    },
    coaching:"Show you've researched them. Mentioning their spin-off experience proves you understand their specific corporate context.",
    resumeKeys:["maestrogrid","rhea"],
    jdKeys:["integration_scope","project_mgmt"]
  },
  {
    category:"Experience Scope",
    q:"This role spans all supplier categories but IT and software represent a substantial share. Walk me through your software sourcing experience.",
    answer: {
      concise: `<p>I've handled heavy IT and software portfolios across my last three roles. At Maestrogrid, I built the IT software framework from scratch, managing assignment clauses, true-ups, and early terminations. At Plural Health, I managed clinical software sourcing, so I'm very familiar with the compliance and security checks required before a vendor can touch patient data.</p>`,
      balanced: `<p>Software is where I spend most of my time. At Maestrogrid, I built the IT software category framework from the ground up. This meant managing not just pricing, but the mechanics of the contracts: assignment clauses, enterprise licensing definitions, and early termination penalties. Those details are the landmines in any consolidation.</p><p>At Rhea Carrison, I managed multi-region IT portfolios, consolidating vendors across different entities. I learned that just because two offices use the same product doesn't mean their licenses are compatible. </p><p>Also, coming from Plural Health, I know that clinical software requires strict compliance checks like SOC 2 and Business Associate Agreements from Day 1.</p>`,
      detailed: `<p>Software is where I spend most of my time, and where I know the most expensive mistakes happen during transitions.</p><p>At Maestrogrid, I built the IT category framework from the ground up. That meant managing the mechanics beneath the contracts: assignment clauses, entity-specific licensing, true-ups, and early termination penalties. When you consolidate software, finding those details early is critical.</p><p>At Rhea Carrison, I managed multi-region IT portfolios. We consolidated vendors across different regional entities. I learned firsthand that the biggest trap in software consolidation is assuming licenses are compatible just because two offices use the same product. Often, one has an enterprise agreement and the other has a named-user contract.</p><p>Finally, coming from Plural Health, I know that clinical software isn't just a commercial negotiation—it's a compliance audit. PIPEDA, HIPAA, SOC 2—these have to be assessed immediately.</p>`
    },
    coaching:"Name specific software contract mechanics: assignment clauses, true-ups, BAAs. It proves you're a specialist, not a generalist.",
    resumeKeys:["maestrogrid","plural","skills"],
    jdKeys:["integration_scope","risk_mgmt","execution"]
  },
  {
    category:"Project Leadership",
    q:"This is an LPB role requiring strong project leadership without direct authority. How do you lead cross-functional teams?",
    answer: {
      concise: `<p>I lead by making cooperation the logical choice for other departments. At Rhea Carrison, I needed regional leaders to change their supplier habits. Instead of forcing a policy, I showed them data on what their old processes were costing their specific budgets and timelines. Once it affected their metrics, they bought in.</p>`,
      balanced: `<p>I've learned that project leadership is about aligning goals, not just managing tasks. People won't change how they work just because procurement asks them to.</p><p>At Rhea Carrison, I led a multi-region vendor governance overhaul. I needed HR, Finance, and IT to change how they interacted with suppliers. Instead of showing up with a new policy document, I built a dashboard that showed them what the old process was costing them specifically—in time, budget, and disruptions. Once the data was personal to their department, cooperation became their idea.</p><p>In integration, cross-functional leadership is about framing. IT cares about technical debt, Finance cares about savings, Legal cares about liability. I frame the sourcing decision differently for each audience while keeping the project moving.</p>`,
      detailed: `<p>I've learned that project leadership is about aligning goals, not just managing tasks. You can't just mandate change in a matrixed organization.</p><p>At Rhea Carrison, I led a multi-region vendor governance overhaul. I needed HR, Finance, and IT to change how they interacted with suppliers. Instead of showing up with a new policy document, I built a dashboard that showed them what the old process was costing them specifically—in time, budget, and disruptions. Once the data was personal to their department, they wanted to fix it.</p><p>In an integration, cross-functional leadership is about framing. IT cares about technical debt, Finance cares about savings, Legal cares about liability. My job is to take the same sourcing decision and frame it differently for each audience, ensuring everyone gets what they need so the project timeline doesn't stall.</p>`
    },
    coaching:"Demonstrate 'influence without authority' by explaining how you align procurement goals with the personal goals of IT, Legal, and Finance.",
    resumeKeys:["rhea","krystal"],
    jdKeys:["project_mgmt","governance"]
  }
],

hm:[
  {
    category:"Disposition Strategy",
    q:"Walk me through exactly how you'd develop supplier disposition recommendations across a large acquired supplier base.",
    answer: {
      concise: `<p>I break it into three phases. First, Data Triangulation: I match 12 months of AP spend against actual contracts to find what's missing. Second, Overlap Analysis: I group every vendor into Consolidate, Retain, Exit, or Re-source based on business need. Third, Contract Mechanics: I review termination clauses to ensure the recommendation is actually executable without massive penalties.</p>`,
      balanced: `<p>I've essentially built this process from scratch at Maestrogrid, where the contract repository didn't match actual AP spend by about 40%.</p><p>Phase 1 is Data Triangulation. I pull 12 months of AP data, cross-reference it against the contracts, and map it against GE Healthcare's supplier list. I'm looking for surprises—vendors with high spend but no formal contract.</p><p>Phase 2 is Overlap Analysis. I put every supplier into one of four buckets: Consolidate, Retain, Exit, or Re-source. If it's a niche clinical vendor with a patient care dependency, we retain it. If it's a redundant CRM, we exit.</p><p>Phase 3 is Contract Mechanics. A recommendation must be executable. I review assignment clauses and termination penalties. If terminating a vendor early triggers a massive penalty, it changes the decision.</p>`,
      detailed: `<p>I've essentially built this process from scratch at Maestrogrid, where our contract repository didn't match our actual AP spend by about 40%.</p><p>Phase 1 is Data Triangulation. I pull 12 months of AP data, cross-reference it against the contract repository, and map it against GE Healthcare's enterprise list. I'm looking for the landmines: a vendor with high spend but no formal contract, or a major renewal expiring in 30 days.</p><p>Phase 2 is Overlap Analysis. For each category, I look at four buckets: Consolidate, Retain, Exit, or Re-source. If it's a niche clinical vendor with a patient care dependency, we Retain. If it's an analytics tool where GEHC already has a global license, we Exit.</p><p>Phase 3 is Contract Mechanics. The recommendation has to be commercially executable. I review assignment clauses and termination provisions. If terminating early triggers a heavy penalty, that changes the financial case for exiting versus letting it run to expiry.</p>`
    },
    coaching:"Show the step-by-step mechanics. The 40% data mismatch detail from Maestrogrid makes your experience sound real and credible.",
    resumeKeys:["maestrogrid","krystal"],
    jdKeys:["disposition_strategy","project_mgmt","integration_scope"]
  },
  {
    category:"IT & Software Risks",
    q:"What are the specific commercial and compliance risks you look for when consolidating software vendors?",
    answer: {
      concise: `<p>I look for three things immediately. First, Change of Control clauses that allow the vendor to terminate or renegotiate pricing. Second, true-up mechanics, to ensure adding the new company's users won't trigger massive list-price fees. Third, data security and compliance posture, like SOC 2 or HIPAA gaps, especially for clinical tools.</p>`,
      balanced: `<p>Software is where the most expensive mistakes happen. I prioritize three specific risks.</p><p>First, Change of Control and Assignment clauses. Some vendors use acquisitions as a trigger to reset pricing. We need to know Day 1 which contracts require consent to assign licenses.</p><p>Second, enterprise licensing scope and true-ups. The question isn't just 'do we both use this software.' It's 'does GE Healthcare's enterprise agreement automatically cover the new entity?' If not, adding users can trigger a true-up at list price.</p><p>Third, regulatory compliance. Coming from Plural Health, I know clinical software requires strict compliance. If we retain a vendor, I gap-assess them against SOC 2 and HIPAA immediately. If they fail, we plan a transition.</p>`,
      detailed: `<p>Software is where the most expensive integration mistakes live, and they usually fall into three categories.</p><p>First, Change of Control and Assignment clauses. A lot of SaaS vendors embed triggers in their agreements because acquisitions are when they reset pricing. We need to know which contracts require written consent to assign licenses to GE Healthcare.</p><p>Second, enterprise licensing scope and true-up mechanics. The question isn't just 'do we both use this software,' it's 'does GE Healthcare's agreement automatically cover the acquired entity?' Sometimes 'Enterprise' is explicitly limited to specific geographies, and new users trigger a true-up at list price.</p><p>Third, data security and compliance. Coming from Plural Health, I know clinical software is a compliance audit, not just a negotiation. I work with InfoSec to gap-assess high-spend vendors against SOC 2 and HIPAA. Vendors who fail go from the Retain list to the Exit list quickly.</p>`
    },
    coaching:"Name the specific landmines: Change of Control, true-ups, and InfoSec posture. This separates you from candidates who just say 'I review contracts'.",
    resumeKeys:["maestrogrid","plural","skills"],
    jdKeys:["risk_mgmt","integration_scope","execution"]
  },
  {
    category:"Lean/Six Sigma",
    q:"The JD calls out Lean/Six Sigma experience. How do you apply process improvement to complex sourcing projects?",
    answer: {
      concise: `<p>I use process improvement to eliminate bottlenecks. At Maestrogrid, contract reviews were taking too long because every vendor was treated the same. I built a triage matrix based on spend and risk. Low-risk indirect vendors got fast-tracked; high-risk IT platforms got deep reviews. That cut our category onboarding cycle by 40%.</p>`,

function saveState(){
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey.trim(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-3-5-haiku-20241022',max_tokens:1200,system,messages:[{role:'user',content:`Question: "${q}"`}]})});
    if(!resp.ok) throw new Error('API Error');
    const data=await resp.json();
    const raw=(data.content&&data.content[0]&&data.content[0].text)||'';
    const m=raw.match(/\{[\s\S]*\}/);
    const parsed=JSON.parse(m?m[0]:raw);
    aiResult={q, answer: parsed.answer, coaching: parsed.coaching, stage:s, resumeKeys: parsed.resumeKeys, jdKeys: parsed.jdKeys};
  }catch(e){
    aiResult={q, isError:true, errorMsg:'Error generating response.'};
  }
  aiGenerating=false;
  renderSearch();
}

function saveAiQ(){

  searchQ=aiResult.q.substring(0,40);aiResult=null;aiDraft='';

}

  });

  return `
    <div class="stage-intro" style="border-left-color:#5a2ca0">
      <h2 style="color:#5a2ca0">Answer Grader</h2>
      <p>Type your answer exactly as you'd speak it. Claude will check for brevity, natural tone, and buzzword usage.</p>
    </div>

      <div style="margin-top:0.85rem">
        <button class="grader-run-btn" onclick="runGrader()" ${!apiKey.startsWith('sk-')||graderLoading?'disabled':''}>${graderLoading?'Grading…':'Grade my answer'}</button>

        <div class="grader-result">

            <div class="grader-section-title">Human & Tone Feedback</div>

            <div class="grader-rewrite-label">✦ Natural Spoken Rewrite</div>
            <div class="answer-text">${graderResult.rewrite}</div>
          </div>
        </div>
      `: ''}
    </div>`;
}

async function runGrader(){
  const answer=(graderAnswer||'').trim();
  if(!answer){alert('Type your answer first.');return;}
  if(!apiKey){alert('API key required.');return;}
  graderLoading=true;renderMain();

  const system=`You are a strict interview coach. Grade this answer for a GE Healthcare M&A Integration sourcing role.
  CRITICAL RULE: The candidate must sound like a normal, competent human speaking. Heavily penalize theatrical hooks, corporate jargon (synergy realization, paradigm, leverage), and overly long sentences.

  Respond ONLY with JSON:
  {
    "verdict": "One short sentence summary.",
    "humanFeedback": "2 sentences pointing out any unnatural phrasing, buzzwords, or areas where it sounds scripted.",
    "rewrite": "<p>A concise, highly natural spoken version. Max 60 seconds spoken length. No bullet points.</p>"
  }`;

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey.trim(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-3-5-haiku-20241022',max_tokens:800,system,messages:[{role:'user',content:`Grade this spoken answer: "${answer}"`}]})});
    const data=await resp.json();
    const m=(data.content[0].text).match(/\{[\s\S]*\}/);
    graderResult=JSON.parse(m[0]);
  }catch(e){graderResult={isError:true};}
  graderLoading=false;renderMain();
}
